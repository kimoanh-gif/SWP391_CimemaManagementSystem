# copy file này xóa example đi và đổi tên thành application-local.properties để chạy được nhé
# mọi người nhớ nhập username và password của sql server vào DB_USERNAME và DB_PASSWORD đây nhé để kết nối với database, nếu không nhập thì sẽ không kết nối được đâu nhé
DB_URL=jdbc:sqlserver://localhost:1433;databaseName=CinemaManagementDB;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true
