###############################################################################
# Cinema Management System – application configuration
# Architecture: classic 3-layer (View -> Controller -> Service -> DAO -> Model)
# Database: Microsoft SQL Server
###############################################################################

spring.application.name=cinema-management-system

# ----- View (Thymeleaf) -----------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# ----- Database (SQL Server – Windows Authentication) ------------------------
# integratedSecurity=true: dùng tài khoản Windows hiện tại (không cần username/password)
# Lưu ý: cần copy sqljdbc_auth.dll vào C:\Windows\System32\ (xem bước 2)
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=CinemaManagementDB;integratedSecurity=true;trustServerCertificate=true;encrypt=true}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=10

# ----- Mail (SMTP – used for OTP & reset) -----------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:lekimoanh1456@gmail.com}
spring.mail.password=${MAIL_PASSWORD:kimoanh2004}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ----- Auth module tunables --------------------------------------------------
# How long an OTP stays valid (seconds)
app.auth.otp.ttl-seconds=300
# Maximum wrong attempts before the OTP is invalidated
app.auth.otp.max-attempts=5
# Session timeout in seconds (30 min)
app.auth.session.timeout-seconds=1800

# ----- VNPAY Sandbox (Iteration 3) ------------------------------------------
app.payment.vnpay.enabled=${VNPAY_ENABLED:false}
app.payment.vnpay.version=2.1.0
app.payment.vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
app.payment.vnpay.tmn-code=${VNPAY_TMN_CODE:}
app.payment.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
app.payment.vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/customer/payment/vnpay/return}
app.payment.vnpay.ipn-url=${VNPAY_IPN_URL:http://localhost:8080/api/payments/vnpay/ipn}
