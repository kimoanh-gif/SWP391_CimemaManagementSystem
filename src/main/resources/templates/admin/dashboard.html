<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Quản trị | CinemaSystem</title>
<link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<div class="dash-shell">
  <header class="dash-header">
    <div class="dash-brand">
      <span class="auth-brand-mark">▶</span><span>CINEMA SYSTEM</span>
    </div>
    <div class="dash-user" th:if="${user != null}">
      <span class="role-badge" th:text="${user.role}">ADMIN</span>
      <span th:text="${user.fullName}">Quản trị</span>
      <form th:action="@{/logout}" method="post">
        <input type="hidden" name="_csrf" th:value="${_csrf.token}">
        <button class="dash-logout" type="submit">Đăng xuất</button>
      </form>
    </div>
    <!-- DEBUG: remove after testing -->
    <div th:if="${user == null}" style="color:#f00;font-size:12px;background:#300;">
      user==null | sessionId=<span th:text="${#session.id}">?</span>
    </div>
  </header>
  <main class="dash-body">
    <h1>Khu vực quản trị</h1>
    <p class="subtitle">Quản lý người dùng, phân quyền, cấu hình hệ thống.</p>
    <div class="dash-card">
      <p>Xin chào <strong th:text="${user != null ? user.fullName : 'quản trị viên'}">quản trị viên</strong>.</p>
      <p style="color: var(--cinema-text-muted);">Các nghiệp vụ quản trị sẽ được bổ sung trong các sprint tiếp theo.</p>
    </div>
  </main>
</div>
</body>
</html>
