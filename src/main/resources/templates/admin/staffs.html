<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff &amp; Manager Accounts | CinemaSystem</title>
<link rel="stylesheet" th:href="@{/css/auth.css}">
<style>
.toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 12px; flex-wrap: wrap; }
.search-box { display: flex; gap: 8px; }
.search-box input { height: 38px; padding: 0 14px; border-radius: var(--radius-md); border: 1.5px solid var(--border); background: var(--surface-raised); color: var(--text-primary); font-size: 13px; width: 280px; transition: border-color .15s; }
.search-box input:focus { outline: none; border-color: var(--purple-400); box-shadow: 0 0 0 3px rgba(167,139,250,.15); }
table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: middle; }
th { background: var(--surface-raised); color: var(--text-secondary); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; font-weight: 700; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--purple-50); }
.empty-row td { text-align: center; color: var(--text-muted); padding: 48px; font-size: 15px; }
.badge { padding: 4px 12px; border-radius: var(--radius-full); font-size: 11px; font-weight: 700; display: inline-block; }
.badge-admin   { background: var(--purple-100); color: var(--purple-700); }
.badge-manager { background: #D1FAE5; color: #065F46; }
.badge-staff   { background: #DBEAFE; color: #1E40AF; }
</style>
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
<button class="sidebar-toggle" onclick="openSidebar()" aria-label="Open menu">☰</button>

<div class="admin-layout">

  <!-- SIDEBAR -->
  <aside class="admin-sidebar" id="adminSidebar">
    <a th:href="@{/admin/dashboard}" class="sidebar-brand">
      <div class="brand-icon">▶</div>
      <div class="brand-text">CINEMA<span>SYSTEM</span></div>
    </a>
    <div class="sidebar-section">Management</div>
    <nav class="sidebar-nav">
      <a th:href="@{/admin/dashboard}" class="sidebar-link">
        <span class="link-icon">🏠</span><span class="link-label">Dashboard</span>
      </a>
      <a th:href="@{/admin/customers}" class="sidebar-link">
        <span class="link-icon">👥</span><span class="link-label">Customers</span>
        <span class="badge-count">UC-36</span>
      </a>
      <a th:href="@{/admin/staffs}" class="sidebar-link active">
        <span class="link-icon">🛡️</span><span class="link-label">Staff &amp; Managers</span>
      </a>
      <a th:href="@{/admin/roles}" class="sidebar-link">
        <span class="link-icon">🔑</span><span class="link-label">Roles &amp; Permissions</span>
      </a>
      <a th:href="@{/admin/config}" class="sidebar-link">
        <span class="link-icon">⚙️</span><span class="link-label">System Configuration</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-user-avatar" th:text="${user != null ? user.fullName.substring(0,1).toUpperCase() : 'A'}">A</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name" th:text="${user != null ? user.fullName : 'Admin'}">Admin</div>
          <div class="sidebar-user-role" th:text="${user != null ? user.role : 'ADMIN'}">ADMIN</div>
        </div>
      </div>
      <form th:action="@{/logout}" method="post">
        <input type="hidden" name="_csrf" th:value="${_csrf.token}">
        <button class="sidebar-logout-btn" type="submit">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Sign Out
        </button>
      </form>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="admin-main">
    <div class="admin-topbar">
      <div class="page-title">🛡️ Staff &amp; Manager Accounts</div>
      <div class="topbar-actions">
        <button class="btn btn-primary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New Staff
        </button>
      </div>
    </div>
    <div class="admin-content">
      <div class="toolbar">
        <div class="search-box">
          <input type="text" placeholder="Search staff by name, email, or username...">
          <button class="btn btn-secondary">🔍 Search</button>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th>#</th><th>Full Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Status</th><th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr class="empty-row">
            <td colspan="7">Staff &amp; manager accounts will be displayed here. This module is under development.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script>
function openSidebar() { document.getElementById('adminSidebar').classList.add('mobile-open'); document.getElementById('sidebarOverlay').classList.add('show'); }
function closeSidebar() { document.getElementById('adminSidebar').classList.remove('mobile-open'); document.getElementById('sidebarOverlay').classList.remove('show'); }
</script>
</body>
</html>
