<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>System Configuration | CINEORA</title>
<link rel="stylesheet" th:href="@{/css/auth.css}">
<style>
/* Page Layout */
.page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
.page-header h1 { font-size: 22px; font-weight: 700; margin: 0; }
.page-desc { color: var(--text-secondary); font-size: 14px; margin: 0; }

/* Category Tabs */
.category-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.tab-btn { padding: 10px 20px; border-radius: var(--radius-md); border: 1.5px solid var(--border); background: var(--surface); color: var(--text-secondary); font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s; }
.tab-btn:hover { border-color: var(--purple-300); color: var(--purple-600); }
.tab-btn.active { background: var(--purple-600); color: white; border-color: var(--purple-600); }

/* Config Sections */
.config-section { display: none; }
.config-section.active { display: block; }

/* Settings Grid */
.settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 16px; }
.setting-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow-sm); }
.setting-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
.setting-card-header h3 { font-size: 14px; margin: 0 0 4px; }
.setting-desc { font-size: 12px; color: var(--text-secondary); margin: 0; }
.setting-badge { font-size: 10px; padding: 3px 8px; border-radius: 10px; font-weight: 600; }
.setting-badge.voucher { background: #FEF3C7; color: #92400E; }
.setting-badge.membership { background: #DBEAFE; color: #1E40AF; }
.setting-badge.booking { background: #D1FAE5; color: #065F46; }
.setting-badge.system { background: #EDE9FE; color: #6D28D9; }

/* Setting Item */
.setting-item { margin-bottom: 16px; }
.setting-item:last-child { margin-bottom: 0; }
.setting-label { display: block; font-size: 12px; font-weight: 600; color: var(--text-primary); margin-bottom: 6px; }
.setting-input-wrap { display: flex; gap: 8px; align-items: center; }
.setting-input { flex: 1; padding: 10px 14px; border-radius: var(--radius-md); border: 1.5px solid var(--border); background: var(--surface-raised); font-size: 14px; font-family: inherit; transition: border-color .15s; }
.setting-input:focus { outline: none; border-color: var(--purple-400); box-shadow: 0 0 0 3px rgba(167,139,250,.2); }
.setting-input.error { border-color: var(--error-icon); }
.setting-input:disabled { background: var(--surface-muted); opacity: 0.7; }
.setting-hint { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
.setting-error { font-size: 11px; color: var(--error-icon); margin-top: 4px; display: none; }
.setting-error.show { display: block; }

/* Buttons */
.btn { padding: 10px 20px; border-radius: var(--radius-md); font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: all .15s; }
.btn-primary { background: var(--purple-600); color: white; }
.btn-primary:hover { background: var(--purple-700); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-secondary { background: var(--surface-raised); color: var(--text-primary); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--purple-50); border-color: var(--purple-300); }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-save { padding: 8px 16px; }

/* Membership Ranks Section */
.ranks-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.rank-card { background: var(--surface); border: 2px solid var(--border); border-radius: var(--radius-lg); padding: 20px; }
.rank-card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.rank-card h3 { font-size: 16px; margin: 0 0 4px; }
.rank-points { font-size: 13px; color: var(--text-secondary); }
.rank-points strong { color: var(--text-primary); }
.rank-threshold { margin-top: 12px; }
.rank-benefits { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
.rank-benefits h4 { font-size: 12px; text-transform: uppercase; color: var(--text-secondary); margin: 0 0 8px; }
.benefit-item { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-primary); margin-bottom: 4px; }
.benefit-item::before { content: "✓"; color: var(--success-icon); font-weight: 700; }

/* Toast */
.toast { position: fixed; bottom: 24px; right: 24px; padding: 14px 20px; border-radius: var(--radius-md); font-size: 14px; font-weight: 500; z-index: 2000; display: none; min-width: 280px; }
.toast.show { display: block; animation: slideUp .3s ease; }
.toast-success { background: var(--success-bg); color: var(--success-text); border: 1px solid var(--success-border); }
.toast-error { background: var(--error-bg); color: var(--error-text); border: 1px solid var(--error-border); }
.toast-info { background: var(--purple-100); color: var(--purple-700); border: 1px solid var(--purple-200); }
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

/* Loading */
.loading { text-align: center; padding: 40px; color: var(--text-muted); }
.spinner { width: 32px; height: 32px; border: 3px solid var(--purple-100); border-top-color: var(--purple-600); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Responsive */
@media (max-width: 768px) {
  .settings-grid { grid-template-columns: 1fr; }
  .category-tabs { overflow-x: auto; flex-wrap: nowrap; padding-bottom: 8px; }
}
</style>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">

<body>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
<button class="sidebar-toggle" onclick="openSidebar()" aria-label="Open menu">☰</button>

<div class="admin-layout">

  <!-- SIDEBAR -->
  <aside class="admin-sidebar" id="adminSidebar">
    <a th:href="@{/admin/dashboard}" class="sidebar-brand">
      <img class="cineora-brand-logo" src="/images/cineora-logo.png" th:src="@{/images/cineora-logo.png}" alt="CINEORA logo">

    <div class="sidebar-section">Management</div>
    <nav class="sidebar-nav">

      </a>

      </a>

  <!-- MAIN -->
  <main class="admin-main">
    <div class="admin-topbar">

    </div>
    <div class="admin-content">

      <!-- Page Header -->
      <div class="page-header">
        <div>
          <h1>System Rules & Configuration</h1>
          <p class="page-desc">Adjust your cinema rules. Review your changes, then save each section.</p>
        </div>
      </div>

      <!-- Category Tabs -->
      <div class="category-tabs">
        <button class="tab-btn active" onclick="switchTab('voucher', this)">Voucher Settings</button>
        <button class="tab-btn" onclick="switchTab('membership', this)">Membership Ranks</button>
        <button class="tab-btn" onclick="switchTab('booking', this)">Booking Rules</button>

      </div>

      <!-- BOOKING RULES -->

        <div class="settings-grid" id="booking-settings"></div>
      </div>

      </div>

    </div>

</div>

<!-- TOAST -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// CSRF Helper
function getCsrfHeaders() {
  const token = document.cookie.match(/XSRF-TOKEN=([^;]+)/)?.[1];
  return token ? { 'X-XSRF-TOKEN': token } : {};
}

// State
let settings = {};
let membershipRanks = [];
let currentValues = {};
let savingCategory = null;

document.addEventListener('DOMContentLoaded', () => {
  loadAllData();
});

async function loadAllData() {
  document.getElementById('loadingIndicator').hidden = false;
  
  try {
    const [settingsResp, ranksResp] = await Promise.all([
      fetch('/api/admin/config/settings', { headers: getCsrfHeaders() }),
      fetch('/api/admin/config/membership/ranks', { headers: getCsrfHeaders() })
    ]);
    
    const settingsJson = await settingsResp.json();
    const ranksJson = await ranksResp.json();
    
    if (!settingsResp.ok || !ranksResp.ok || !settingsJson.success || !ranksJson.success) throw new Error("Unable to load configuration");
    currentValues = {};
    settings = settingsJson.data || {};
    membershipRanks = ranksJson.data || [];
    
    for (const category in settings) {
      settings[category].forEach(s => {
        currentValues[s.settingId] = s.value;
      });
    }
    
    renderAllSections();
  } catch (e) {
    showToast('Failed to load configuration.', 'error');
    console.error(e);
  } finally {
    document.getElementById('loadingIndicator').hidden = true;
  }
}

function renderAllSections() {
  renderVoucherSettings();
  renderMembershipRanks();
  renderBookingSettings();
  renderSystemSettings();
}

function switchTab(tab, button) {
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  button.classList.add('active');
  
  document.querySelectorAll('.config-section').forEach(sec => sec.classList.remove('active'));
  document.getElementById('section-' + tab).classList.add('active');
}

function renderVoucherSettings() {
  const container = document.getElementById('voucher-settings');
  const voucherSettings = settings['VOUCHER'] || [];
  if (!voucherSettings.length) {
    container.innerHTML = '<div class="loading">No voucher settings found.</div>';
    return;
  }
  const presentation = {
    VOUCHER_VALIDITY_DAYS: { order: 1, title: 'Thời hạn hiệu lực', label: 'Thời hạn của voucher', unit: 'ngày' },
    VOUCHER_MIN_BOOKING_AMOUNT: { order: 2, title: 'Giá trị đơn tối thiểu', label: 'Giá trị đặt vé tối thiểu', unit: 'VNĐ' },
    VOUCHER_MAX_DISCOUNT_PERCENT: { order: 3, title: 'Giới hạn giảm giá', label: 'Phần trăm giảm tối đa', unit: '%' },
    VOUCHER_TOTAL_LIMIT: { order: 4, title: 'Giới hạn tổng số lượng', label: 'Số lượng voucher tối đa', unit: 'mã' },
    VOUCHER_PER_USER_LIMIT: { order: 5, title: 'Giới hạn mỗi tài khoản', label: 'Số voucher tối đa mỗi khách hàng', unit: 'mã' }
  };
  const ordered = [...voucherSettings].sort((a, b) => (presentation[a.settingKey]?.order || 99) - (presentation[b.settingKey]?.order || 99));
  container.innerHTML = `<div class="voucher-policy">
    <div class="voucher-toolbar">
      <div><span class="voucher-eyebrow">VOUCHER SETTINGS</span><h2>Quy tắc voucher</h2><p>Điều chỉnh thời hạn, mức giảm và giới hạn số lượng.</p></div>
      ${renderSaveBar('VOUCHER')}
    </div>
    <div class="voucher-policy-grid">
      ${ordered.map((setting, index) => {
        const info = presentation[setting.settingKey] || { title: setting.settingName, label: setting.settingName, unit: '' };
        const field = renderSettingItem({ ...setting, settingName: info.label })
          .replace('class="setting-input-wrap"', 'class="setting-input-wrap" data-unit="' + escHtml(info.unit) + '"');
        return `<section class="voucher-policy-card" aria-labelledby="voucher-title-${setting.settingId}">
          <div class="voucher-card-heading"><span class="voucher-step">${String(index + 1).padStart(2, '0')}</span><h3 id="voucher-title-${setting.settingId}">${escHtml(info.title)}</h3></div>
          ${field}
        </section>`;
      }).join('')}
    </div>
  </div>`;
}

function renderBookingSettings() {
  const container = document.getElementById('booking-settings');
  const bookingSettings = settings['BOOKING'] || [];
  
  if (bookingSettings.length === 0) {
    container.innerHTML = '<div class="loading">No booking settings found.</div>';
    return;
  }
  
  container.innerHTML = `
    <div class="setting-card">
      <div class="setting-card-header">
        <div>
          <h3>Booking Rules</h3>
          <p class="setting-desc">Configure booking limits and cancellation rules</p>
        </div>
        <span class="setting-badge booking">BOOKING</span>
      </div>
      ${bookingSettings.map(s => renderSettingItem(s)).join('')}
      ${renderSaveBar('BOOKING')}
    </div>
  `;
}

function renderSystemSettings() {
  const container = document.getElementById('system-settings');
  const systemSettings = settings['SYSTEM'] || [];
  
  if (systemSettings.length === 0) {
    container.innerHTML = '<div class="loading">No system settings found.</div>';
    return;
  }
  
  container.innerHTML = `
    <div class="setting-card">
      <div class="setting-card-header">
        <div>
          <h3>System Settings</h3>
          <p class="setting-desc">Configure security and authentication rules</p>
        </div>
        <span class="setting-badge system">SYSTEM</span>
      </div>
      ${systemSettings.map(s => renderSettingItem(s)).join('')}
      ${renderSaveBar('SYSTEM')}
    </div>
  `;
}

function renderSaveBar(category) {
  return `<div class="config-savebar">
    <div><strong id="status-${category}" role="status" aria-live="polite">All changes saved</strong><p>Changes apply only after you save.</p></div>
    <div class="config-save-actions">
      <button type="button" class="btn btn-secondary" id="discard-${category}" onclick="discardChanges('${category}')" disabled>Discard</button>
      <button type="button" class="btn btn-primary" id="save-${category}" onclick="saveCategory('${category}')" disabled>Save changes</button>
    </div>
  </div>`;
}

function renderSettingItem(setting) {
  const inputType = getInputType(setting);
  const hint = getValidationHint(setting);
  const readonly = (setting.validationRules || '').includes('readonly');
  const value = currentValues[setting.settingId] ?? setting.value ?? '';
  const min = (setting.validationRules || '').match(/min:([\d.-]+)/)?.[1];
  const max = (setting.validationRules || '').match(/max:([\d.-]+)/)?.[1];
  return `<div class="setting-item" data-id="${setting.settingId}">
    <div class="setting-details">
      <label class="setting-label" for="input-${setting.settingId}">${escHtml(setting.settingName)}${readonly ? ' <span class="readonly-label">Read-only</span>' : ''}</label>
      ${hint ? `<div class="setting-hint" id="hint-${setting.settingId}">${escHtml(hint)}</div>` : ''}
    </div>
    <div class="setting-control">
      <div class="setting-input-wrap">
        ${inputType === 'checkbox' ? `<input type="checkbox" class="setting-checkbox" id="input-${setting.settingId}"
          ${value === 'true' || value === '1' ? 'checked' : ''} ${readonly ? 'disabled' : ''}
          onchange="handleInputChange(${setting.settingId}, this.checked ? 'true' : 'false')">` :
        `<input type="${inputType}" ${inputType === 'number' ? 'step="any"' : ''} class="setting-input" id="input-${setting.settingId}" value="${escHtml(value)}"
          aria-describedby="${hint ? 'hint-' + setting.settingId + ' ' : ''}error-${setting.settingId}" ${readonly ? 'disabled' : ''}
          ${min !== undefined ? `min="${min}"` : ''} ${max !== undefined ? `max="${max}"` : ''}
          oninput="handleInputChange(${setting.settingId}, this.value)">`}
        ${!readonly && setting.defaultValue != null ? `<button type="button" class="btn btn-sm btn-secondary reset-setting" onclick="resetToDefault(${setting.settingId})">Reset</button>` : ''}
      </div>
      <div class="setting-error" id="error-${setting.settingId}" role="alert"></div>
    </div>
  </div>`;
}

function getInputType(setting) {
  if (setting.valueType === 'BOOLEAN') return 'checkbox';
  if (setting.valueType === 'NUMBER') return 'number';
  if (setting.valueType === 'DATE') return 'datetime-local';
  return 'text';
}

function getValidationHint(setting) {
  const rules = setting.validationRules;
  if (!rules) return '';
  
  const hints = [];
  if (rules.includes('min:')) {
    const match = rules.match(/min:(\d+)/);
    if (match) hints.push(`Min: ${match[1]}`);
  }
  if (rules.includes('max:')) {
    const match = rules.match(/max:(\d+)/);
    if (match) hints.push(`Max: ${match[1]}`);
  }
  return hints.join(' | ');
}

function findSetting(id) {
  return Object.values(settings).flat().find(setting => setting.settingId === id);
}

function dirtySettings(category) {
  return (settings[category] || []).filter(setting =>
    !(setting.validationRules || '').includes('readonly') &&
    String(currentValues[setting.settingId] ?? '') !== String(setting.value ?? ''));
}

function updateSaveState(category) {
  const count = dirtySettings(category).length;
  const busy = savingCategory !== null;
  document.getElementById('save-' + category).disabled = busy || count === 0;
  document.getElementById('discard-' + category).disabled = busy || count === 0;
  document.getElementById('save-' + category).textContent = savingCategory === category ? 'Saving…' : 'Save changes';
  const status = document.getElementById('status-' + category);
  status.textContent = savingCategory === category ? 'Saving your changes…' : count ? count + ' unsaved change' + (count === 1 ? '' : 's') : 'All changes saved';
  status.classList.toggle('is-dirty', count > 0);
}

function handleInputChange(settingId, value) {
  currentValues[settingId] = value;
  showSettingError(settingId, '');
  updateSaveState(findSetting(settingId).category);
}

function showSettingError(settingId, message) {
  const error = document.getElementById('error-' + settingId);
  error.textContent = message;
  error.classList.toggle('show', Boolean(message));
  const input = document.getElementById('input-' + settingId);
  input.classList.toggle('error', Boolean(message));
  input.setAttribute('aria-invalid', String(Boolean(message)));
}

function resetToDefault(settingId) {
  if (savingCategory) return;
  const setting = findSetting(settingId);
  if (setting.defaultValue == null) return;
  const input = document.getElementById('input-' + settingId);
  if (input.type === 'checkbox') input.checked = setting.defaultValue === 'true' || setting.defaultValue === '1';
  else input.value = setting.defaultValue;
  handleInputChange(settingId, String(setting.defaultValue));
}

function discardChanges(category) {
  if (savingCategory) return;
  for (const setting of settings[category] || []) {
    currentValues[setting.settingId] = setting.value;
    const input = document.getElementById('input-' + setting.settingId);
    if (input.type === 'checkbox') input.checked = setting.value === 'true' || setting.value === '1';
    else input.value = setting.value ?? '';
    showSettingError(setting.settingId, '');
  }
  updateSaveState(category);
}

async function saveCategory(category) {
  if (savingCategory) return;
  const changes = dirtySettings(category);
  if (!changes.length) return;
  let invalid = false;
  for (const setting of changes) {
    const input = document.getElementById('input-' + setting.settingId);
    if (!input.checkValidity() || (input.type === 'number' && input.value.trim() === '')) {
      showSettingError(setting.settingId, input.validationMessage || 'Enter a valid number.');
      if (!invalid) input.focus();
      invalid = true;
    }
  }
  if (invalid) return;
  savingCategory = category;
  const section = document.getElementById('section-' + category.toLowerCase());
  const editable = [...section.querySelectorAll('input:not(:disabled), .reset-setting:not(:disabled)')];
  editable.forEach(control => control.disabled = true);
  Object.keys(settings).forEach(key => { if (document.getElementById('save-' + key)) updateSaveState(key); });
  let failed = 0;
  try {
    for (const setting of changes) {
      const value = currentValues[setting.settingId];
      try {
        const response = await fetch('/api/admin/config/settings/' + setting.settingId, {
          method: 'PUT', headers: { 'Content-Type': 'application/json', ...getCsrfHeaders() },
          body: JSON.stringify({ value })
        });
        const result = await response.json();
        if (!response.ok || !result.success) throw new Error(result.message || 'Unable to save this setting.');
        setting.value = value;
        showSettingError(setting.settingId, '');
      } catch (error) {
        failed++;
        showSettingError(setting.settingId, error.message || 'Connection failed. Please try again.');
      }
    }
    showToast(failed ? failed + ' change(s) could not be saved. Check the highlighted fields and try again.' : 'Configuration saved successfully.', failed ? 'error' : 'success');
  } finally {
    savingCategory = null;
    editable.forEach(control => control.disabled = false);
    Object.keys(settings).forEach(key => { if (document.getElementById('save-' + key)) updateSaveState(key); });
  }
}

window.addEventListener('beforeunload', event => {
  const pending = Object.keys(settings).some(category => dirtySettings(category).length > 0) || Object.keys(rankInputs).length > 0;
  if (pending) { event.preventDefault(); event.returnValue = ''; }
});

function orderedRanks() {
  return [...membershipRanks].sort((a, b) => a.minPoints - b.minPoints || a.rankId - b.rankId);
}

function rankBenefitsSummary(rank) {
  const benefits = parseBenefits(rank.benefits);
  const items = [];
  if (benefits.pointsRate != null) items.push('Tích điểm ×' + benefits.pointsRate);
  if (benefits.birthdayBonus) items.push('Ưu đãi sinh nhật');
  if (benefits.priorityBooking) items.push('Ưu tiên đặt vé');
  if (benefits.freeSnacks) items.push('Tặng bắp nước');
  return items.length ? items.map(escHtml).join('<br>') : 'Chưa có quyền lợi';
}

function renderMembershipRanks() {
  const container = document.getElementById('membership-ranks');
  const ranks = orderedRanks();
  container.innerHTML = `<div class="membership-heading">
    <div><span class="voucher-eyebrow">MEMBERSHIP RANKS</span><h2>Hạng thành viên</h2><p>Cấu hình ngưỡng điểm thăng hạng. Thay đổi không điều chỉnh điểm của từng khách hàng.</p></div>
    <span class="membership-count">${ranks.length} hạng</span>
  </div>
  <div class="membership-rule">Điểm tối thiểu phải là số nguyên không âm và tăng dần theo thứ tự hạng. Bấm Lưu trên từng hàng để áp dụng.</div>
  <div class="membership-table-wrap"><table class="membership-table">
    <thead><tr><th scope="col">Hạng thành viên</th><th scope="col">Điểm tối thiểu</th><th scope="col">Điểm tối đa</th><th scope="col">Quyền lợi</th><th scope="col">Giảm giá</th><th scope="col">Trạng thái</th><th scope="col">Thao tác</th></tr></thead>
    <tbody>${ranks.length ? ranks.map(rank => `<tr>
      <td><span class="membership-code">${escHtml(rank.name)}</span><strong class="membership-name">${escHtml(rank.displayName || rank.name)}</strong></td>
      <td class="membership-threshold"><label class="sr-only" for="rank-${rank.rankId}">Điểm tối thiểu của ${escHtml(rank.displayName || rank.name)}</label>
        <input type="number" class="setting-input" id="rank-${rank.rankId}" min="0" max="2147483647" step="1"
          value="${escHtml(rankInputs[rank.rankId] ?? rank.minPoints)}" aria-describedby="rank-error-${rank.rankId}"
          oninput="handleRankInput(${rank.rankId}, this.value)" ${savingRankId !== null ? 'disabled' : ''}>
        <div class="setting-error" role="alert" id="rank-error-${rank.rankId}"></div></td>
      <td class="membership-number">${rank.maxPoints == null ? '<span class="membership-unlimited">Không giới hạn</span>' : escHtml(Number(rank.maxPoints).toLocaleString('vi-VN'))}</td>
      <td class="membership-benefits">${rankBenefitsSummary(rank)}</td>
      <td><span class="membership-discount">${escHtml(rank.discountPercent ?? '0')}%</span></td>
      <td><span class="membership-state ${rank.isActive ? 'active' : 'inactive'}">${rank.isActive ? 'Hoạt động' : 'Tạm ngưng'}</span></td>
      <td><div class="membership-actions">
        <button type="button" class="btn btn-primary btn-sm" id="save-rank-${rank.rankId}" onclick="updateRankThreshold(${rank.rankId})" ${rankInputs[rank.rankId] === undefined || savingRankId !== null ? 'disabled' : ''}>Lưu</button>
        <button type="button" class="btn btn-secondary btn-sm" id="discard-rank-${rank.rankId}" onclick="discardRank(${rank.rankId})" ${rankInputs[rank.rankId] === undefined || savingRankId !== null ? 'disabled' : ''}>Hủy</button>
      </div></td>
    </tr>`).join('') : '<tr><td colspan="7" class="membership-empty">Chưa có hạng thành viên.</td></tr>'}</tbody>
  </table></div>`;
}

function parseBenefits(benefitsJson) {
  try {
    const value = JSON.parse(benefitsJson || '{}');
    return value && typeof value === 'object' && !Array.isArray(value) ? value : {};
  } catch (e) {
    return {};
  }
}

let rankInputs = {};
let savingRankId = null;

function rankValidationMessage(rankId, raw) {
  const value = String(raw).trim();
  if (!/^\d+$/.test(value) || !Number.isSafeInteger(Number(value)) || Number(value) > 2147483647) {
    return 'Nhập số nguyên từ 0 đến 2.147.483.647.';
  }
  const ranks = orderedRanks();
  const index = ranks.findIndex(rank => rank.rankId === rankId);
  if (index < 0) return 'Không tìm thấy hạng thành viên.';
  const points = Number(value);
  if (ranks[index].maxPoints != null && points > ranks[index].maxPoints) return 'Điểm tối thiểu không được vượt điểm tối đa của hạng (' + ranks[index].maxPoints + ').';
  if (index > 0 && ranks[index - 1].maxPoints != null && points <= ranks[index - 1].maxPoints) return 'Điểm phải lớn hơn điểm tối đa của hạng trước (' + ranks[index - 1].maxPoints + ').';
  if (index > 0 && points <= ranks[index - 1].minPoints) {
    return 'Điểm phải lớn hơn ngưỡng ' + ranks[index - 1].minPoints + ' của ' + (ranks[index - 1].displayName || ranks[index - 1].name) + '.';
  }
  if (index < ranks.length - 1 && points >= ranks[index + 1].minPoints) {
    return 'Điểm phải nhỏ hơn ngưỡng ' + ranks[index + 1].minPoints + ' của ' + (ranks[index + 1].displayName || ranks[index + 1].name) + '.';
  }
  return '';
}

function showRankError(rankId, message) {
  const error = document.getElementById('rank-error-' + rankId);
  error.textContent = message;
  error.classList.toggle('show', Boolean(message));
  const input = document.getElementById('rank-' + rankId);
  input.classList.toggle('error', Boolean(message));
  input.setAttribute('aria-invalid', String(Boolean(message)));
}

function handleRankInput(rankId, value) {
  const saved = membershipRanks.find(rank => rank.rankId === rankId);
  if (saved && String(saved.minPoints) === value) delete rankInputs[rankId];
  else rankInputs[rankId] = value;
  const message = rankValidationMessage(rankId, value);
  showRankError(rankId, message);
  document.getElementById('save-rank-' + rankId).disabled = savingRankId !== null || rankInputs[rankId] === undefined || Boolean(message);
  document.getElementById('discard-rank-' + rankId).disabled = savingRankId !== null || rankInputs[rankId] === undefined;
}

function discardRank(rankId) {
  if (savingRankId !== null) return;
  const saved = membershipRanks.find(rank => rank.rankId === rankId);
  if (!saved) return;
  document.getElementById('rank-' + rankId).value = saved.minPoints;
  delete rankInputs[rankId];
  showRankError(rankId, '');
  document.getElementById('save-rank-' + rankId).disabled = true;
  document.getElementById('discard-rank-' + rankId).disabled = true;
}

async function updateRankThreshold(rankId) {
  if (savingRankId !== null || rankInputs[rankId] === undefined) return;
  const value = rankInputs[rankId];
  const message = rankValidationMessage(rankId, value);
  if (message) { showRankError(rankId, message); document.getElementById('rank-' + rankId).focus(); return; }
  savingRankId = rankId;
  const controls = [...document.getElementById('membership-ranks').querySelectorAll('input, button')];
  controls.forEach(control => control.disabled = true);
  document.getElementById('save-rank-' + rankId).textContent = 'Đang lưu…';
  try {
    const response = await fetch('/api/admin/config/membership/ranks/' + rankId + '/threshold', {
      method: 'PUT', headers: { 'Content-Type': 'application/json', ...getCsrfHeaders() },
      body: JSON.stringify({ minPoints: Number(value) })
    });
    const result = await response.json();
    if (!response.ok || !result.success) throw new Error(result.message || 'Không thể lưu ngưỡng điểm.');
    membershipRanks.find(rank => rank.rankId === rankId).minPoints = Number(value);
    delete rankInputs[rankId];
    showToast('Đã lưu ngưỡng điểm thành công.', 'success');
    await loadMembershipRanks();
  } catch (error) {
    showRankError(rankId, error.message || 'Lỗi kết nối. Vui lòng thử lại.');
    showToast('Chưa lưu được thay đổi. Vui lòng kiểm tra lại.', 'error');
  } finally {
    savingRankId = null;
    controls.forEach(control => control.disabled = false);
    for (const rank of membershipRanks) {
      const draft = rankInputs[rank.rankId];
      document.getElementById('save-rank-' + rank.rankId).textContent = 'Lưu';
      const validation = draft === undefined ? '' : rankValidationMessage(rank.rankId, draft);
      if (validation) showRankError(rank.rankId, validation);
      document.getElementById('save-rank-' + rank.rankId).disabled = draft === undefined || Boolean(validation);
      document.getElementById('discard-rank-' + rank.rankId).disabled = draft === undefined;
      document.getElementById('rank-' + rank.rankId).disabled = false;
    }
  }
}

async function loadMembershipRanks() {
  try {
    const response = await fetch('/api/admin/config/membership/ranks', { headers: getCsrfHeaders() });
    const result = await response.json();
    if (!response.ok || !result.success || !Array.isArray(result.data)) throw new Error('Unable to reload ranks');
    membershipRanks = result.data;
    renderMembershipRanks();
  } catch (error) {
    renderMembershipRanks();
    showToast('Đã lưu nhưng chưa tải lại được dữ liệu. Hãy tải lại trang để kiểm tra.', 'info');
  }
}

function showToast(message, type) {
  const t = document.getElementById('toast');
  t.textContent = message;
  t.className = `toast show toast-${type}`;
  setTimeout(() => t.classList.remove('show'), 4000);
}

function escHtml(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function openSidebar() { document.getElementById('adminSidebar').classList.add('mobile-open'); document.getElementById('sidebarOverlay').classList.add('show'); }
function closeSidebar() { document.getElementById('adminSidebar').classList.remove('mobile-open'); document.getElementById('sidebarOverlay').classList.remove('show'); }
</script>
</body>
</html>
