<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Food &amp; Beverage | CinemaSystem</title><link rel="stylesheet" th:href="@{/css/auth.css}"><link rel="stylesheet" th:href="@{/css/staff-workspace.css}">
  <script th:src="@{/js/staff-sales.js}" defer></script></head>
<body data-page="foods" th:attr="data-held-until=${summary.heldUntil}">
<div class="dash-shell"><header class="dash-header"><a class="dash-brand" th:href="@{/staff/dashboard}"><span class="auth-brand-mark">▶</span><span>CINEMA SYSTEM</span></a><span>Order <strong th:text="${summary.bookingCode}"></strong></span></header>
<main class="dash-body staff-content"><a class="staff-text-link" th:href="@{/staff/sales}">← Cancel Sales Flow</a>
  <h1>Food &amp; Beverage</h1><p class="subtitle">Pending order · Seat hold expires in <strong id="staffHoldCountdown">10:00</strong></p>
  <p class="staff-alert error" th:if="${errorMessage}" th:text="${errorMessage}"></p>
  <p class="staff-alert success" th:if="${successMessage}" th:text="${successMessage}"></p>
  <form th:action="@{/staff/sales/foods}" method="post" class="staff-food-layout">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <section class="staff-food-grid">
      <article class="dash-card staff-food-card" th:each="item : ${items}">
        <div><p class="staff-eyebrow" th:text="${item.itemType}">COMBO</p><h2 th:text="${item.name}">Combo</h2><p class="staff-muted" th:text="${item.description}"></p></div>
        <div class="staff-food-pick"><strong th:text="${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT') + ' VND'}">0 VND</strong>
          <input type="hidden" name="itemIds" th:value="${item.itemId}">
          <input class="staff-control staff-quantity" name="quantities" type="number" min="0" max="20" th:value="${item.quantity}" th:attr="data-price=${item.price}" th:aria-label="${'Quantity for ' + item.name}">
        </div>
      </article>
      <p class="staff-empty dash-card" th:if="${#lists.isEmpty(items)}">No active food and beverage items are available. You can still complete the order.</p>
    </section>
    <aside class="dash-card staff-order-panel">
      <h2 th:text="${summary.movieTitle}">Movie</h2>
      <p th:text="${summary.roomName + ' · ' + #temporals.format(summary.startTime, 'HH:mm dd/MM/yyyy')}"></p>
      <p>Seats: <strong th:text="${summary.seatLabels}"></strong></p>
      <p>Tickets: <strong th:text="${#numbers.formatDecimal(summary.seatTotal, 0, 'COMMA', 0, 'POINT') + ' VND'}"></strong></p>
      <p>Food &amp; Beverage: <strong id="staffFoodTotal">0 VND</strong></p>
      <p class="staff-total">Total: <strong id="staffGrandTotal" th:attr="data-seat-total=${summary.seatTotal}">0 VND</strong></p>
      <button class="staff-button staff-button-primary staff-full" type="submit">Save Pending Order</button>
    </aside>
  </form>
  <form th:action="@{/staff/sales/cancel}" method="post" class="staff-cancel-form"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="staff-button" type="submit">Cancel Order &amp; Release Seats</button></form>
</main></div></body></html>
