<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bookings | CINEORA Staff</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/cineora-staff.css}">
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
<button class="sidebar-toggle" onclick="openSidebar()" aria-label="Open menu">&#9776;</button>

<div class="staff-layout">

  <!-- SIDEBAR -->
  <div th:replace="~{fragments/staff-layout :: sidebar('bookings')}"></div>

  <!-- MAIN -->
  <div class="staff-main">
    <div th:replace="~{fragments/staff-layout :: topbar('Bookings', '')}"></div>

    <div class="staff-content">

      <!-- Heading -->
      <div class="content-heading">
        <div>
          <p class="eyebrow">CINEORA / STAFF</p>
          <h1>Bookings</h1>
          <p>Search by booking code or phone number, or filter by status.</p>
        </div>
      </div>

      <!-- Filter Form -->
      <div class="panel">
        <div class="panel-header">
          <div><h2>Search &amp; Filter</h2></div>
        </div>
        <div class="panel-body">
          <form th:action="@{/staff/bookings}" method="get" class="inline-form">
            <div class="form-group">
              <label class="form-label" for="q">Booking Code / Phone</label>
              <input class="form-control" id="q" name="q" th:value="${bookingPage.query}"
                     placeholder="e.g. BK... or phone number" style="min-width:220px;">
            </div>
            <div class="form-group">
              <label class="form-label" for="status">Status</label>
              <select class="form-control" id="status" name="status">
                <option value="">All Statuses</option>
                <option value="PENDING"   th:selected="${bookingPage.status == 'PENDING'}">Pending</option>
                <option value="CONFIRMED" th:selected="${bookingPage.status == 'CONFIRMED'}">Confirmed</option>
                <option value="PAYMENT_PENDING" th:selected="${bookingPage.status == 'PAYMENT_PENDING'}">Payment Pending</option>
                <option value="CANCELLED" th:selected="${bookingPage.status == 'CANCELLED'}">Cancelled</option>
                <option value="EXPIRED"   th:selected="${bookingPage.status == 'EXPIRED'}">Expired</option>
              </select>
            </div>
            <div class="form-group" style="padding-top:18px;">
              <button class="btn btn-primary" type="submit">Search</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Results Table -->
      <div class="panel">
        <div class="panel-header">
          <div>
            <h2>Results</h2>
            <p th:text="${bookingPage.totalItems} + ' booking(s) found'">0 booking(s) found</p>
          </div>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Booking Code</th>
                <th>Customer</th>
                <th>Movie / Showtime</th>
                <th>Type</th>
                <th>Status</th>
                <th>Total</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="booking : ${bookingPage.bookings}">
                <td><strong th:text="${booking.bookingCode}"></strong></td>
                <td>
                  <span th:text="${booking.customerName != null ? booking.customerName : 'Walk-in Customer'}"></span>
                  <span class="td-sub" th:text="${booking.phone}"></span>
                </td>
                <td>
                  <span th:text="${booking.movieTitle}"></span>
                  <span class="td-sub" th:text="${#temporals.format(booking.showtime, 'dd/MM HH:mm')}"></span>
                </td>
                <td th:text="${booking.bookingType}"></td>
                <td>
                  <span class="badge"
                        th:classappend="${'badge-' + #strings.toLowerCase(booking.status)}"
                        th:text="${booking.status}"></span>
                </td>
                <td th:text="${#numbers.formatDecimal(booking.totalAmount,0,'COMMA',0,'POINT') + ' VND'}"></td>
                <td>
                  <a class="btn btn-secondary" style="padding:5px 12px;font-size:12px;"
                     th:href="@{/staff/bookings/{id}(id=${booking.bookingId})}">Details</a>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(bookingPage.bookings)}">
                <td colspan="7">
                  <div class="empty-state">
                    <div class="empty-icon">📋</div>
                    <div class="empty-text">No bookings found.</div>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Pagination -->
        <div class="pagination" th:if="${bookingPage.totalPages > 1}">
          <a th:if="${bookingPage.page > 0}"
             th:href="@{/staff/bookings(page=${bookingPage.page - 1},q=${bookingPage.query},status=${bookingPage.status})}">← Previous</a>
          <span th:text="'Page ' + (${bookingPage.page + 1}) + ' of ' + ${bookingPage.totalPages} + ' · ' + ${bookingPage.totalItems} + ' bookings'"></span>
          <a th:if="${bookingPage.page + 1 < bookingPage.totalPages}"
             th:href="@{/staff/bookings(page=${bookingPage.page + 1},q=${bookingPage.query},status=${bookingPage.status})}">Next →</a>
        </div>
      </div>

    </div>
  </div>
</div>

<div th:replace="~{fragments/staff-layout :: sidebar-scripts}"></div>
</body>
</html>
