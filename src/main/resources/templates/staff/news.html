<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" th:content="${_csrf.token}">
  <title>News Management | CINEORA Staff</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/cineora-staff.css}">
  <script th:src="@{/js/staff-news.js}" defer></script>
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
<button class="sidebar-toggle" onclick="openSidebar()" aria-label="Open menu">&#9776;</button>

<div class="staff-layout">
  <div th:replace="~{fragments/staff-layout :: sidebar('news')}"></div>

  <div class="staff-main">
    <div th:replace="~{fragments/staff-layout :: topbar('News Management', '')}"></div>

    <div class="staff-content">

      <div class="content-heading">
        <div>
          <p class="eyebrow">CINEORA / STAFF</p>
          <h1>News Management</h1>
          <p>Draft, save or submit articles for manager review.</p>
        </div>
      </div>

      <div class="two-col">

        <!-- Editor panel -->
        <div class="panel">
          <div class="panel-header">
            <div>
              <h2 id="editorTitle">New Article</h2>
              <p>Fill in the fields below then save or submit.</p>
            </div>
          </div>
          <div class="panel-body">
            <p id="newsFeedback" class="alert" role="status" aria-live="polite" style="display:none;"></p>
            <form id="newsForm">
              <div class="form-group">
                <label class="form-label" for="newsTitle">Title</label>
                <input class="form-control" id="newsTitle" maxlength="255" required
                       placeholder="Article title…">
              </div>
              <div class="form-group">
                <label class="form-label" for="newsThumbnail">Thumbnail Image URL</label>
                <input class="form-control" id="newsThumbnail" type="url" maxlength="500"
                       placeholder="https://…">
              </div>
              <div class="form-group">
                <label class="form-label" for="newsContent">Content</label>
                <textarea class="form-control" id="newsContent" rows="9" required
                          placeholder="Write article content here…"></textarea>
              </div>
              <div style="display:flex;gap:10px;flex-wrap:wrap;">
                <button class="btn btn-secondary" type="submit" value="DRAFT">Save Draft</button>
                <button class="btn btn-primary"   type="submit" value="PENDING">Submit for Review</button>
                <button class="btn btn-secondary" id="cancelEdit" type="button" hidden>Cancel Edit</button>
              </div>
            </form>
          </div>
        </div>

        <!-- Articles list panel -->
        <div class="panel">
          <div class="panel-header">
            <div><h2>Articles</h2><p>Your submitted and draft articles</p></div>
          </div>
          <div class="panel-body">
            <p id="newsListMessage" style="color:var(--text-muted);font-size:13px;">Loading articles…</p>
            <div id="newsList" style="display:flex;flex-direction:column;gap:12px;"></div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<div th:replace="~{fragments/staff-layout :: sidebar-scripts}"></div>
</body>
</html>
