<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ticket Check-In | CINEORA Staff</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/cineora-staff.css}">
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
<button class="sidebar-toggle" onclick="openSidebar()" aria-label="Open menu">&#9776;</button>

<div class="staff-layout">
  <div th:replace="~{fragments/staff-layout :: sidebar('check-in')}"></div>

  <div class="staff-main">
    <div th:replace="~{fragments/staff-layout :: topbar('Ticket Check-In', '')}"></div>

    <div class="staff-content">

      <div class="content-heading">
        <div>
          <p class="eyebrow">CINEORA / STAFF</p>
          <h1>Ticket Check-In</h1>
          <p>Verify customer tickets at the entrance gate.</p>
        </div>
      </div>

      <!-- Alerts -->
      <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}" role="status"></div>
      <div class="alert alert-error"   th:if="${errorMessage}"   th:text="${errorMessage}"   role="alert"></div>

      <!-- Check-in form -->
      <div class="panel checkin-card">
        <div class="panel-header">
          <div>
            <h2>🎫 Validate Booking Code</h2>
            <p>Enter the booking code shown on the customer's ticket or confirmation email.</p>
          </div>
        </div>
        <div class="panel-body">
          <form th:action="@{/staff/check-in}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="form-group">
              <label class="form-label" for="bookingCode">Booking Code</label>
              <input class="form-control" id="bookingCode" name="bookingCode"
                     autocomplete="off"
                     placeholder="Enter booking code (e.g. BK-20241023-0001)"
                     style="max-width:440px;"
                     required>
            </div>
            <button class="btn btn-primary" type="submit">Confirm Check-In ✓</button>
          </form>
        </div>
      </div>

      <!-- Info note -->
      <div class="alert alert-info">
        ℹ️ Only <strong>CONFIRMED</strong> bookings with unused tickets can be checked in during the valid time window.
      </div>

    </div>
  </div>
</div>

<div th:replace="~{fragments/staff-layout :: sidebar-scripts}"></div>
</body>
</html>
