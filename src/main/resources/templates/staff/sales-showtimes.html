<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Counter Sales | CINEORA Staff</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/cineora-staff.css}">
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
<button class="sidebar-toggle" onclick="openSidebar()" aria-label="Open menu">&#9776;</button>

<div class="staff-layout">
  <div th:replace="~{fragments/staff-layout :: sidebar('sales')}"></div>

  <div class="staff-main">
    <div th:replace="~{fragments/staff-layout :: topbar('Counter Sales', '')}"></div>

    <div class="staff-content">

      <div class="content-heading">
        <div>
          <p class="eyebrow">CINEORA / STAFF</p>
          <h1>Counter Ticket Sales</h1>
          <p>Choose a date, movie and showtime to start an order.</p>
        </div>
      </div>

      <!-- Error -->
      <div class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

      <!-- Date picker -->
      <div class="panel">
        <div class="panel-header">
          <div><h2>Select Show Date</h2></div>
        </div>
        <div class="panel-body">
          <form th:action="@{/staff/sales}" method="get" class="inline-form">
            <div class="form-group">
              <label class="form-label" for="date">Show Date</label>
              <input class="form-control" id="date" name="date" type="date"
                     th:value="${selectedDate}" th:min="${today}" th:max="${maxDate}"
                     style="width:180px;" required>
            </div>
            <div class="form-group" style="padding-top:18px;">
              <button class="btn btn-primary" type="submit">Find Showtimes →</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Movie + showtime list -->
      <div th:if="${!#lists.isEmpty(movies)}">
        <div class="panel" th:each="movie : ${movies}">
          <div class="movie-card">
            <img class="movie-poster" th:if="${movie.posterUrl}" th:src="${movie.posterUrl}"
                 th:alt="${movie.title}" onerror="this.style.display='none'">
            <div class="movie-info">
              <p class="eyebrow" th:text="${movie.genres != null and !movie.genres.isBlank() ? movie.genres : 'MOVIE'}">MOVIE</p>
              <h2 th:text="${movie.title}">Movie Title</h2>
              <p style="font-size:12px;color:var(--text-muted);margin-top:4px;"
                 th:text="${movie.duration + ' min · ' + (movie.ageRating != null ? movie.ageRating : 'P')}"></p>
              <div class="showtime-grid">
                <form th:each="showtime : ${movie.showtimes}"
                      th:action="@{/staff/sales/showtime}" method="post">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                  <input type="hidden" name="showtimeId" th:value="${showtime.showtimeId}">
                  <button class="showtime-btn" type="submit" th:disabled="${showtime.availableSeats < 1}">
                    <strong th:text="${#temporals.format(showtime.startTime, 'HH:mm')}">19:30</strong>
                    <span  th:text="${showtime.roomName}">Screen 1</span>
                    <small th:text="${showtime.availableSeats + ' seats'}">0 seats</small>
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Empty -->
      <div class="panel" th:if="${#lists.isEmpty(movies)}">
        <div class="empty-state">
          <div class="empty-icon">🎬</div>
          <div class="empty-text">No movies or available showtimes found for this date.</div>
        </div>
      </div>

    </div>
  </div>
</div>

<div th:replace="~{fragments/staff-layout :: sidebar-scripts}"></div>
</body>
</html>
