<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title th:text="'Error ' + ${status} + ' | CINEORA'">Error | CINEORA</title>
  <link rel="icon" type="image/png" href="/images/cineora-logo.png">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:#28202a;background:radial-gradient(circle at 8% 7%,rgba(255,218,202,.9),transparent 29%),radial-gradient(circle at 92% 88%,rgba(242,184,75,.2),transparent 28%),#fff8f0;font-family:"Segoe UI",Arial,sans-serif}.topbar{height:76px;display:flex;align-items:center;padding:0 max(24px,calc((100% - 1180px)/2));border-bottom:1px solid #eadbd5;background:rgba(255,250,245,.92);box-shadow:0 4px 24px rgba(75,35,34,.06)}.brand{display:flex;align-items:center;gap:11px;color:#28202a;text-decoration:none}.brand img{width:43px;height:43px;object-fit:contain}.brand strong{display:block;color:#b3001f;font-family:Georgia,serif;font-size:21px;letter-spacing:.08em}.brand small{display:block;color:#756c72;font-size:10px;letter-spacing:.08em}.shell{width:min(1050px,calc(100% - 40px));margin:0 auto;padding:65px 0 80px}.card{display:grid;grid-template-columns:minmax(260px,.72fr) minmax(0,1.28fr);overflow:hidden;border:1px solid #eadbd5;border-radius:26px;background:rgba(255,255,255,.94);box-shadow:0 24px 70px rgba(76,39,35,.13)}.visual{position:relative;display:flex;min-height:500px;align-items:center;justify-content:center;flex-direction:column;padding:45px;color:#fff;text-align:center;background:linear-gradient(145deg,#870018,#b3001f 58%,#dc6557)}.visual:after{content:"";position:absolute;width:280px;height:280px;border:45px solid rgba(255,255,255,.06);border-radius:50%}.code{position:relative;z-index:1;margin:0;font-family:Georgia,serif;font-size:clamp(90px,14vw,155px);font-weight:800;line-height:.85;letter-spacing:-.06em}.visual span{position:relative;z-index:1;margin-top:25px;font-size:11px;font-weight:800;letter-spacing:.2em}.content{padding:52px}.eyebrow{margin:0 0 10px;color:#b3001f;font-size:11px;font-weight:900;letter-spacing:.16em}.content h1{margin:0 0 12px;font-family:Georgia,serif;font-size:clamp(30px,4vw,44px);letter-spacing:-.03em}.message{margin:0;color:#756c72;font-size:16px;line-height:1.7}.diagnostic{margin-top:27px;overflow:hidden;border:1px solid #eadbd5;border-radius:14px;background:#fffaf6}.diagnostic header{display:flex;justify-content:space-between;gap:12px;padding:12px 15px;color:#5e4244;border-bottom:1px solid #eadbd5;background:#fff1ec;font-size:11px;font-weight:900;letter-spacing:.08em}.log-row{display:grid;grid-template-columns:105px minmax(0,1fr);gap:12px;padding:11px 15px;border-bottom:1px solid #f1e5df;font:12px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace}.log-row:last-child{border:0}.log-row b{color:#9b3343}.log-row span{min-width:0;color:#4b3d40;overflow-wrap:anywhere}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}.button{display:inline-flex;min-height:45px;align-items:center;justify-content:center;padding:0 19px;color:#4b302e;border:1px solid #eadbd5;border-radius:10px;background:#fff;text-decoration:none;font-weight:800}.button.primary{color:#fff;border-color:#b3001f;background:linear-gradient(135deg,#b3001f,#d93b3b);box-shadow:0 9px 22px rgba(179,0,31,.2)}.meta{margin:18px 0 0;color:#958a8f;font-size:11px}@media(max-width:760px){.topbar{height:66px;padding:0 18px}.shell{width:calc(100% - 24px);padding:28px 0}.card{grid-template-columns:1fr}.visual{min-height:210px;padding:28px}.visual:after{width:180px;height:180px;border-width:30px}.code{font-size:88px}.visual span{margin-top:14px}.content{padding:29px 21px}.log-row{grid-template-columns:1fr;gap:3px}.actions{flex-direction:column}.button{width:100%}}
  </style>
</head>
<body>
<header class="topbar"><a class="brand" href="/"><img src="/images/cineora-logo.png" alt="CINEORA"><span><strong>CINEORA</strong><small>EVERY STORY BEGINS HERE</small></span></a></header>
<main class="shell"><section class="card">
  <div class="visual"><p class="code" th:text="${status}">404</p><span>REQUEST INTERRUPTED</span></div>
  <div class="content"><p class="eyebrow">CINEORA SYSTEM NOTICE</p><h1 th:text="${headline}">Không tìm thấy trang</h1><p class="message" th:text="${message}">Trang bạn yêu cầu không tồn tại.</p>
    <section class="diagnostic" aria-label="Error details"><header><span>THÔNG TIN LỖI</span><span th:text="${errorType}">HTTP 404</span></header>
      <div class="log-row"><b>Status</b><span th:text="${status + ' · ' + error}">404 · Not Found</span></div>
      <div class="log-row" th:if="${path}"><b>Request</b><span th:text="${path}">/unknown</span></div>
      <div class="log-row"><b>Error</b><span th:text="${errorDetail}">Not Found</span></div>
      <div class="log-row" th:if="${rootCause != null and !#strings.isEmpty(rootCause)}"><b>Root cause</b><span th:text="${rootCause}">Cause</span></div>
    </section>
    <div class="actions"><a class="button primary" href="/">Về trang chủ</a><a class="button" href="javascript:history.back()">Quay lại</a></div><p class="meta"><span th:text="${timestamp}">2026-01-01 00:00:00 UTC</span></p>
  </div>
</section></main>
</body></html>
