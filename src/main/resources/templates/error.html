<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="'Error ' + ${status} + ' | CINEORA'">Error | CINEORA</title>
  <link rel="icon" type="image/png" href="/images/cineora-logo.png">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Inter,"Segoe UI",sans-serif;color:#f8fafc;background:radial-gradient(circle at 20% 10%,#3b1b62 0,transparent 32%),radial-gradient(circle at 90% 85%,#7f1d1d 0,transparent 28%),#09090f}.card{position:relative;width:min(720px,100%);overflow:hidden;padding:56px;border:1px solid rgba(255,255,255,.13);border-radius:28px;background:rgba(20,18,30,.86);box-shadow:0 30px 90px rgba(0,0,0,.5);backdrop-filter:blur(18px)}.reel{position:absolute;width:220px;height:220px;right:-55px;top:-60px;border:22px solid rgba(168,85,247,.13);border-radius:50%}.reel:before,.reel:after{content:"";position:absolute;inset:45px;border:20px dotted rgba(248,113,113,.16);border-radius:50%}.reel:after{inset:78px;border:10px solid rgba(255,255,255,.08)}.eyebrow{margin:0 0 22px;color:#c4b5fd;font-size:13px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}.code{margin:0;font-size:clamp(86px,20vw,156px);font-weight:900;line-height:.82;letter-spacing:-.08em;background:linear-gradient(135deg,#f8fafc 20%,#c084fc 60%,#fb7185);-webkit-background-clip:text;color:transparent}h1{margin:30px 0 12px;font-size:clamp(28px,5vw,42px);letter-spacing:-.03em}.message{max-width:530px;margin:0;color:#b8b5c5;font-size:17px;line-height:1.7}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}.button{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 21px;border:1px solid rgba(255,255,255,.16);border-radius:12px;color:#fff;text-decoration:none;font-weight:750;background:rgba(255,255,255,.06)}.button.primary{border-color:transparent;background:linear-gradient(135deg,#7c3aed,#db2777)}.meta{margin-top:32px;color:#716d80;font-size:12px}@media(max-width:560px){.card{padding:38px 26px;border-radius:22px}.reel{opacity:.55}}
  </style>
</head>
<body><main class="card"><div class="reel" aria-hidden="true"></div><p class="eyebrow">CINEORA · Lost scene</p><p class="code" th:text="${status}">404</p><h1 th:text="${headline}">Page not found</h1><p class="message" th:text="${message}">The page you requested could not be found.</p><div class="actions"><a class="button primary" href="/">Back to Home</a><a class="button" href="javascript:history.back()">Go Back</a></div><p class="meta"><span th:text="${timestamp}">2026-01-01 00:00:00 UTC</span><span th:if="${path}"> · </span><span th:if="${path}" th:text="${path}">/unknown</span></p></main></body>
</html>
