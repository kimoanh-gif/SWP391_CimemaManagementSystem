<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/></head>
<body>

<!--
  Shared Manager Sidebar Fragment
  Contains ALL 9 Manager Functions matching Hình 1:
    1. dashboard   - Tổng quan (Dashboard)
    2. movies      - Phim chiếu rạp
    3. genres      - Thể loại phim
    4. rooms       - Phòng chiếu & Thiết bị
    5. seat-types  - Danh mục loại ghế
    6. seats       - Sơ đồ bố trí ghế
    7. showtimes   - Lịch & Suất chiếu
    8. pricing     - Bảng giá & Vé
    9. fb          - Bắp nước & F&B
-->
<aside th:fragment="sidebar(activeMenu)" class="sidebar">

    <!-- Brand -->
    <a class="sidebar-brand" th:href="@{/manager/dashboard}">
        <div class="sidebar-brand-icon">R</div>
        <div class="sidebar-brand-text">
            <div class="sidebar-brand-name">ROYALLY</div>
            <div class="sidebar-brand-sub">Cinema Admin</div>
        </div>
    </a>

    <!-- Navigation -->
    <nav class="sidebar-nav">

        <span class="sidebar-section-label">Operations</span>

        <!-- 1. Dashboard -->
        <a th:href="@{/manager/dashboard}"
           th:classappend="${activeMenu == 'dashboard'} ? ' active' : ''"
           class="sidebar-link">
            <span class="nav-icon">📊</span> Dashboard
        </a>

        <!-- 2. Movies -->
        <a th:href="@{/manager/movies}"
           th:classappend="${activeMenu == 'movies'} ? ' active' : ''"
           class="sidebar-link">
            <span class="nav-icon">🎬</span> Movies
        </a>

        <!-- 3. Genres -->
        <a th:href="@{/manager/genres}"
           th:classappend="${activeMenu == 'genres'} ? ' active' : ''"
           class="sidebar-link">
            <span class="nav-icon">🏷</span> Genres
        </a>

        <!-- 4. Rooms -->
        <a th:href="@{/manager/rooms}"
           th:classappend="${activeMenu == 'rooms'} ? ' active' : ''"
           class="sidebar-link">
            <span class="nav-icon">🏟</span> Screening Rooms
        </a>

        <!-- 5. Seat Types -->
        <a th:href="@{/manager/seat-types}"
           th:classappend="${activeMenu == 'seat-types'} ? ' active' : ''"
           class="sidebar-link">
            <span class="nav-icon">💺</span> Seat Types
        </a>

        <!-- 6. Seats Layout -->
        <a th:href="@{/manager/seats}"
           th:classappend="${activeMenu == 'seats'} ? ' active' : ''"
           class="sidebar-link">
            <span class="nav-icon">🗺</span> Seat Layout
        </a>

        <!-- 7. Showtimes -->
        <a th:href="@{/manager/showtimes}"
           th:classappend="${activeMenu == 'showtimes'} ? ' active' : ''"
           class="sidebar-link">
            <span class="nav-icon">🕐</span> Showtimes
        </a>

        <span class="sidebar-section-label">System &amp; Services</span>

        <!-- 8. Pricing -->
        <a th:href="@{/manager/pricing}"
           th:classappend="${activeMenu == 'pricing'} ? ' active' : ''"
           class="sidebar-link">
            <span class="nav-icon">💳</span> Ticket Pricing
        </a>

        <!-- 9. F&B -->
        <a th:href="@{/manager/fb}"
           th:classappend="${activeMenu == 'fb'} ? ' active' : ''"
           class="sidebar-link">
            <span class="nav-icon">🍿</span> Concessions &amp; F&amp;B
        </a>

        <a href="#" class="sidebar-link nav-disabled" title="Extended modules">
            <span class="nav-icon">🎁</span> Promotions &amp; Vouchers
        </a>

        <!-- 10. Revenue Reports & Export (Screens 47 & 49) -->
        <a th:href="@{/manager/reports}"
           th:classappend="${activeMenu == 'reports'} ? ' active' : ''"
           class="sidebar-link">
            <span class="nav-icon">📈</span> Revenue Reports
        </a>
    </nav>

    <!-- Footer user -->
    <div class="sidebar-footer">
        <div class="avatar">M</div>
        <div class="sidebar-footer-info">
            <div class="sidebar-footer-name" th:text="${userName != null} ? ${userName} : 'Cinema Manager'">Cinema Manager</div>
            <div class="sidebar-footer-role" th:text="${userRole != null} ? ${userRole} : 'Administrator / Manager'">Administrator / Manager</div>
        </div>
        <div class="sidebar-status-dot" title="System operational"></div>
    </div>

    <!-- Logout -->
    <style>
        /* Logout (sidebar) */
        .sidebar-logout-form { padding: 0 14px 14px; flex-shrink: 0; margin: 0; }
        .sidebar-logout-btn {
            width: 100%;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 9px 12px;
            background: var(--danger-light); color: var(--danger);
            border: 1px solid #FECACA; border-radius: 8px;
            font-family: inherit; font-size: 13px; font-weight: 600;
            cursor: pointer; transition: background .15s, color .15s;
        }
        .sidebar-logout-btn:hover { background: var(--danger); color: #fff; border-color: var(--danger); }

        /* Logout (topbar) */
        .topbar-logout-form { margin: 0; }
        .topbar-logout-btn {
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            background: transparent; color: var(--text-500);
            border: 1px solid var(--border); border-radius: 8px;
            cursor: pointer; transition: background .15s, color .15s, border-color .15s;
        }
        .topbar-logout-btn:hover { background: var(--danger-light); color: var(--danger); border-color: #FECACA; }
    </style>
    <form th:action="@{/logout}" method="post" class="sidebar-logout-form">
        <button type="submit" class="sidebar-logout-btn" title="Logout">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            Logout
        </button>
    </form>

</aside>

<!-- Shared Topbar Fragment -->
<header th:fragment="topbar(pageTitle)" class="topbar">

    <div class="topbar-spacer"></div>

    <div class="topbar-date">
        📅 <span th:text="${currentDateStr != null} ? ${currentDateStr} : 'Today'">Today</span>
    </div>

    <div class="topbar-icon-btn" title="Notifications">
        🔔
        <span class="topbar-notif-badge">3</span>
    </div>

    <div class="topbar-user">
        <div class="avatar">M</div>
        <div class="topbar-user-info">
            <span class="topbar-user-name" th:text="${userName != null} ? ${userName} : 'Cinema Manager'">Cinema Manager</span>
            <span class="topbar-user-role">Manager</span>
        </div>
    </div>

    <form th:action="@{/logout}" method="post" class="topbar-logout-form">
        <button type="submit" class="topbar-logout-btn" title="Logout">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
        </button>
    </form>

</header>

</body>
</html>
