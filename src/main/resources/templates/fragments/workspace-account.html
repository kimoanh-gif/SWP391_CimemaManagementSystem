<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><body>
<th:block th:fragment="menu(displayName, displayRole)">
  <link rel="stylesheet" th:href="@{/css/workspace-account.css}" href="/css/workspace-account.css">
  <details class="workspace-account">
    <summary class="workspace-account-trigger" aria-label="Open account menu">
      <img class="workspace-account-avatar" th:src="@{/images/cineora-logo.png}" src="/images/cineora-logo.png" alt="">
      <span class="workspace-account-identity"><strong th:text="${displayName}">My account</strong><small th:text="${displayRole}">Staff</small></span>
      <svg class="workspace-account-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </summary>
    <div class="workspace-account-menu">
      <th:block th:if="${permissionUser != null and permissionUser.hasRole('STAFF', 'MANAGER')}">
        <a th:href="@{/account/profile}" href="/account/profile">My Profile</a>
        <a th:href="@{/account/profile#account-security}" href="/account/profile#account-security">Change Password</a>
      </th:block>
      <form th:action="@{/logout}" action="/logout" method="post">
        <input type="hidden" th:name="${_csrf != null ? _csrf.parameterName : '_csrf'}" th:value="${_csrf != null ? _csrf.token : ''}">
        <button type="submit">Log Out</button>
      </form>
    </div>
  </details>
  <script th:src="@{/js/workspace-account.js}" src="/js/workspace-account.js" defer></script>
</th:block>
</body></html>
