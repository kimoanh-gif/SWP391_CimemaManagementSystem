<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
    Reusable movie card for the public screens (Home Page, Movie List, Movie Details → related movies).
    Shows: poster, title, genres, duration, age rating, release date, rating,
           View Details and Book Ticket (Now Showing) / Coming Soon label.
    Assignee: Nguyễn Đức Anh (Iter2)
-->
<article th:fragment="card(movie)" class="movie-card">
    <div class="movie-poster-wrap">
        <a th:href="@{/movies/{id}(id=${movie.movieId})}" th:attr="aria-label=${'View details of ' + movie.title}">
            <img th:src="${movie.posterUrl}" th:alt="${movie.title}" class="movie-poster" loading="lazy" decoding="async"
                 onerror="this.onerror=null;this.src='/images/cinema-login-hero.png'" />
        </a>
        <span class="badge-rating" th:classappend="${movie.ageRatingBadgeClass}" th:text="${movie.ageRating}">P</span>
        <span class="badge-duration" th:text="${movie.duration + ' min'}">118 min</span>

        <div class="movie-card-overlay" th:if="${movie.trailerUrl != null && !#strings.isEmpty(movie.trailerUrl)}">
            <button type="button" class="btn-play-trailer" title="Watch trailer"
                    th:data-trailer="${movie.trailerUrl}"
                    onclick="openTrailer(this.dataset.trailer)">▶</button>
        </div>
    </div>

    <div class="movie-card-body">
        <h3 class="movie-card-title">
            <a th:href="@{/movies/{id}(id=${movie.movieId})}" th:text="${movie.title}">Movie Title</a>
        </h3>
        <div class="movie-card-genres"
             th:text="${#strings.isEmpty(movie.genresFormatted) ? 'Genre not updated yet' : movie.genresFormatted}">Action, Adventure</div>
        <div class="movie-card-meta">
            <span class="movie-rating-stars" th:if="${movie.reviewCount != null && movie.reviewCount > 0}">
                ⭐ <span th:text="${movie.averageRating}">4.8</span>
                <span style="font-size:0.75rem;color:var(--text-muted);" th:text="${'(' + movie.reviewCount + ')'}">(12)</span>
            </span>
            <span class="rating-new" th:unless="${movie.reviewCount != null && movie.reviewCount > 0}">No ratings yet</span>
            <span th:text="${movie.formattedReleaseDate}">18/10/2026</span>
        </div>
        <div class="movie-card-actions">
            <a th:href="@{/movies/{id}(id=${movie.movieId})}" class="btn-card-detail">Details</a>
            <a th:if="${movie.nowShowing}" th:href="@{/movies/{id}(id=${movie.movieId})} + '#showtimes'" class="btn-card-book">Book Ticket</a>
            <a th:if="${movie.comingSoon}" th:href="@{/movies/{id}(id=${movie.movieId})} + '#showtimes'"
               class="btn-card-detail" style="border-color:var(--gold);color:var(--gold);">Coming Soon</a>
        </div>
    </div>
</article>
</body>
</html>
