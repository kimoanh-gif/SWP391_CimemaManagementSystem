<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create New Password | CINEORA</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/cineora-register.css" th:href="@{/css/cineora-register.css}">
<link rel="stylesheet" href="/css/cineora-reset-password.css" th:href="@{/css/cineora-reset-password.css}">
</head>
<body>
<header class="topbar"><div class="top-inner">
<a href="/" th:href="@{/}" class="brand" aria-label="CINEORA Home"><img src="/images/cineora-logo.png" th:src="@{/images/cineora-logo.png}" alt="CINEORA logo"><span><span class="brand-name">CINEORA</span><span class="brand-tag">Every Story Begins Here</span></span></a>
<a class="back" href="/login" th:href="@{/login}">Back to Sign In</a>
</div></header>
<main><section class="card" aria-labelledby="reset-title"><div class="accent"></div><div class="content">
<div class="intro"><img class="hero-logo" src="/images/cineora-logo.png" th:src="@{/images/cineora-logo.png}" alt="CINEORA"><span class="eyebrow">Account Recovery</span><h1 id="reset-title">Create New Password</h1><p>Your verification code is confirmed. Choose a new password for your CINEORA account.</p></div>
<div class="recovery-progress" role="img" aria-label="Password recovery: step 3 of 4"><span class="complete"></span><span class="complete"></span><span class="complete"></span><span></span></div>
<div class="auth-notice error" role="alert" th:if="${formError}" th:text="${formError}"></div>
<form th:action="@{/reset-password}" th:object="${resetPasswordForm}" method="post" novalidate>
        <input type="hidden" name="_csrf" th:value="${_csrf.token}">
        <div class="auth-field" th:classappend="${passwordError != null} ? 'has-error' : ''">
          <label for="password">NEW PASSWORD</label>
          <div class="auth-input-wrap" th:classappend="${passwordError != null} ? 'invalid' : ''">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            <input id="password" type="password" th:field="*{password}" autocomplete="new-password" maxlength="128"
                   placeholder="At least 8 characters, letters and numbers" required>
            <button class="auth-show-pw" type="button" id="togglePassword" aria-label="Show password">
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2"/></svg>
            </button>
          </div>
          <div class="pwd-policy" id="pwdPolicy" aria-live="polite">
            <div class="req" data-req="len">At least 8 characters</div>
            <div class="req" data-req="letter">At least one letter</div>
            <div class="req" data-req="digit">At least one digit</div>
            <div class="req" data-req="match">Confirm password must match</div>
          </div>
          <p class="auth-error" th:if="${passwordError}" th:text="${passwordError}"></p>
        </div>

        <div class="auth-field" th:classappend="${confirmPasswordError != null} ? 'has-error' : ''">
          <label for="confirmPassword">CONFIRM NEW PASSWORD</label>
          <div class="auth-input-wrap" th:classappend="${confirmPasswordError != null} ? 'invalid' : ''">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="m9 16 2 2 4-4"/></svg>
            <input id="confirmPassword" type="password" th:field="*{confirmPassword}" autocomplete="new-password" maxlength="128"
                   placeholder="Re-enter new password" required>
          </div>
          <p class="auth-error" th:if="${confirmPasswordError}" th:text="${confirmPasswordError}"></p>
        </div>

        <button class="auth-btn" type="submit" id="submitBtn">
          <span class="label">RESET PASSWORD</span><span class="spinner" aria-hidden="true"></span>
        </button>
      </form>
<div class="auth-bottom"><a th:href="@{/login}">← Back to Login</a></div>
</div></section></main>
<script>
(() => {
  const pw = document.getElementById('password');
  const cpw = document.getElementById('confirmPassword');
  const toggle = document.getElementById('togglePassword');
  if (toggle && pw) {
    toggle.addEventListener('click', () => {
      const visible = pw.type === 'password';
      pw.type = visible ? 'text' : 'password';
      cpw.type = visible ? 'text' : 'password';
      toggle.setAttribute('aria-label', visible ? 'Hide password' : 'Show password');
    });
  }
  const policy = document.getElementById('pwdPolicy');
  const check = () => {
    if (!policy || !pw) return;
    policy.querySelector('[data-req="len"]').classList.toggle('ok', pw.value.length >= 8);
    policy.querySelector('[data-req="letter"]').classList.toggle('ok', /[A-Za-z]/.test(pw.value));
    policy.querySelector('[data-req="digit"]').classList.toggle('ok', /\d/.test(pw.value));
    policy.querySelector('[data-req="match"]').classList.toggle('ok', pw.value !== '' && pw.value === cpw.value);
  };
  if (pw) pw.addEventListener('input', check);
  if (cpw) cpw.addEventListener('input', check);
  check();

  const btn = document.getElementById('submitBtn');
  if (btn) {
    document.querySelector('form').addEventListener('submit', () => {
      btn.classList.add('loading');
      btn.disabled = true;
      setTimeout(() => { btn.classList.remove('loading'); btn.disabled = false; }, 8000);
    });
  }
})();
</script>
</body>
</html>
