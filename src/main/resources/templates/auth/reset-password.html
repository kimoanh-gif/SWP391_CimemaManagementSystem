<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Đặt lại mật khẩu | CinemaSystem</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#08090d;color:#f7f5f2;font-family:Arial,sans-serif;display:grid;place-items:center;padding:24px;background-image:linear-gradient(90deg,#080509d9,#08090df0),url('/images/cinema-login-hero.png');background-size:cover;background-position:center}.card{width:min(100%,470px);padding:38px;border:1px solid #3c3b41;border-radius:22px;background:rgba(15,16,22,.95);box-shadow:0 24px 70px #0008}.brand{color:#f5a04b;font-size:12px;font-weight:bold;letter-spacing:.22em;margin-bottom:24px}.eyebrow{color:#f5a04b;font-size:12px;letter-spacing:.15em}h1{font-family:Georgia,serif;font-size:34px;font-weight:500;margin:10px 0}p{color:#b7b5be;line-height:1.65;font-size:14px}.field{margin-top:22px}label{display:block;font-size:13px;font-weight:bold;margin-bottom:9px}input{width:100%;padding:15px;border:1px solid #444650;border-radius:10px;background:#090a0f;color:white;outline:none;font-size:15px}input:focus{border-color:#f5a04b;box-shadow:0 0 0 3px #f5a04b25}.btn{width:100%;border:0;border-radius:10px;padding:15px;background:linear-gradient(100deg,#f5a04b,#e77a24);color:#1d1007;font-weight:800;cursor:pointer;margin-top:24px}.error{color:#ffd09b;background:#6e421b35;border:1px solid #b87a3b;border-radius:9px;padding:12px;font-size:13px;margin:16px 0}
</style></head><body><main class="card"><div class="brand">CinemaSystem</div><div class="eyebrow">New password</div><h1>Tạo mật khẩu mới</h1><p>Hãy chọn mật khẩu mới có ít nhất 8 ký tự.</p><div class="error" th:if="${formError}" th:text="${formError}" role="alert"></div><form th:action="@{/reset-password}" th:object="${resetPasswordForm}" method="post"><div class="field"><label for="password">MẬT KHẨU MỚI</label><input id="password" type="password" th:field="*{password}" minlength="8" maxlength="128" autocomplete="new-password" placeholder="Ít nhất 8 ký tự" required><div class="error" th:if="${passwordError}" th:text="${passwordError}"></div></div><div class="field"><label for="confirmPassword">NHẬP LẠI MẬT KHẨU</label><input id="confirmPassword" type="password" th:field="*{confirmPassword}" minlength="8" maxlength="128" autocomplete="new-password" placeholder="Nhập lại mật khẩu mới" required><div class="error" th:if="${confirmPasswordError}" th:text="${confirmPasswordError}"></div></div><button class="btn" type="submit">CẬP NHẬT MẬT KHẨU</button></form></main></body></html>
