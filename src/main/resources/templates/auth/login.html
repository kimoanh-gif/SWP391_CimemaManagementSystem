<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | CINEORA</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/cineora-login.css" th:href="@{/css/cineora-login.css}">
</head>
<body>
<header>
  <a class="brand" href="/" th:href="@{/}" aria-label="CINEORA Home"><img class="brand-mark" src="/images/cineora-logo.png" th:src="@{/images/cineora-logo.png}" alt="CINEORA logo"><span><strong>CINEORA</strong><small>Every Story Begins Here</small></span></a>
  <a class="back" href="/" th:href="@{/}">← Back to Home</a>
</header>
<main>
  <section class="card" aria-labelledby="login-title">
    <div class="eyebrow">The Art of Cinema</div>
    <img class="seal" src="/images/cineora-logo.png" th:src="@{/images/cineora-logo.png}" alt="CINEORA emblem">
    <span class="tag">CINEORA MEMBER ACCESS</span>
    <h1 id="login-title">Welcome Back</h1>
    <p class="intro">Sign in to book tickets and enjoy your CINEORA cinema experience.</p>
    <div class="auth-notice error" role="alert" th:if="${formError}" th:text="${formError}" th:attr="data-locked-seconds=${lockedSeconds}"></div>
    <div class="auth-notice success" role="status" th:if="${logoutSuccess}" th:text="${logoutSuccess}"></div>
    <div class="auth-notice success" role="status" th:if="${activationSuccess}" th:text="${activationSuccess}"></div>
    <div class="auth-notice success" role="status" th:if="${resetSuccess}" th:text="${resetSuccess}"></div>
    <div class="auth-notice error" role="alert" th:if="${oauthError}" th:text="${oauthError}"></div>
    <div class="auth-notice error" role="alert" th:if="${oauthRejected}" th:text="${oauthRejected}"></div>
    <form id="loginForm" th:action="@{/login(redirect=${redirect})}" th:object="${loginForm}" method="post" autocomplete="on" novalidate>
        <input type="hidden" name="_csrf" th:value="${_csrf.token}">
        <div class="field" th:classappend="${identifierError != null} ? 'has-error' : ''">
          <label class="field-label" for="identifier">Email or Username</label>
          <div class="input-wrap" th:classappend="${identifierError != null} ? 'invalid' : ''">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
            <input id="identifier" type="text" th:field="*{identifier}" autocomplete="username" maxlength="255"
                   placeholder="name@example.com or username" required>
          </div>
          <p class="auth-error" th:if="${identifierError}" th:text="${identifierError}"></p>
        </div>

        <div class="field" th:classappend="${passwordError != null} ? 'has-error' : ''">
          <label class="field-label" for="password">Password</label>
          <div class="input-wrap" th:classappend="${passwordError != null} ? 'invalid' : ''">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="M12 14v3"/></svg>
            <input id="password" type="password" th:field="*{password}" autocomplete="current-password" maxlength="128"
                   placeholder="Enter your password" required>
            <button class="eye" type="button" id="togglePassword" aria-label="Show password" title="Show/hide password">
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <p class="auth-error" th:if="${passwordError}" th:text="${passwordError}"></p>
        </div>

        <!-- Options -->
        <div class="options">
          <label class="remember">
            <input type="checkbox" id="rememberIdentifier"><span>Remember me</span>
          </label>
          <a th:href="@{/forgot-password}">Forgot password?</a>
        </div>


        <!-- Submit -->
        <button class="sign-in" type="submit" id="submitBtn">
          <span class="label">Sign In</span><span aria-hidden="true">&rarr;</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>
      </form>
    <div class="divider" th:if="${googleOAuthEnabled}">or continue with</div>
    <a class="google" th:if="${googleOAuthEnabled}" th:href="@{/oauth2/authorization/google}" href="/oauth2/authorization/google"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.27 5.48-4.79 7.18l7.73 6C44.39 38.03 46.98 31.88 46.98 24.55z"/><path fill="#FBBC05" d="M10.53 28.59A14.41 14.41 0 0 1 9.75 24c0-1.59.27-3.13.76-4.59l-7.98-6.2A23.9 23.9 0 0 0 0 24c0 3.87.93 7.52 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.91-5.8l-7.73-6C30.03 37.65 27.27 38.5 24 38.5c-6.26 0-11.57-4.22-13.47-9.91l-7.97 6.19C6.51 42.62 14.62 48 24 48z"/></svg>Continue with Google</a>
    <div class="register-prompt">Don't have an account? <a href="/register" th:href="@{/register}">Create an account →</a></div>
  </section>
</main>
<script>
(() => {
  // Show / hide password
  const pw = document.getElementById('password');
  const toggle = document.getElementById('togglePassword');
  if (toggle && pw) {
    toggle.addEventListener('click', () => {
      const visible = pw.type === 'password';
      pw.type = visible ? 'text' : 'password';
      toggle.setAttribute('aria-label', visible ? 'Hide password' : 'Show password');
      document.getElementById('eyeIcon').innerHTML = visible
        ? '<path d="M3 3l18 18"/><path d="M10.6 6.2A10.7 10.7 0 0 1 12 6c6.5 0 10 6 10 6a16 16 0 0 1-3.2 3.8M6.2 6.2C3.5 8 2 12 2 12s3.5 6 10 6c1.3 0 2.5-.3 3.5-.7"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>'
        : '<path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>';
    });
  }

  // Only the identifier is stored here; passwords stay with the browser password manager.
  const form = document.getElementById('loginForm');
  const id = document.getElementById('identifier');
  const remember = document.getElementById('rememberIdentifier');
  const rememberHelp = document.getElementById('rememberHelp');
  const storageKey = 'cinema-login-identifier';
  function storageUnavailable() {
    if (rememberHelp) rememberHelp.textContent = 'Your browser has blocked local storage, so your email/username cannot be remembered. Password autofill is managed by your browser.';
  }
  function saveIdentifierPreference() {
    if (!id || !remember) return;
    try {
      const identifier = id.value.trim();
      if (remember.checked && identifier) localStorage.setItem(storageKey, identifier);
      else localStorage.removeItem(storageKey);
    } catch (_) { storageUnavailable(); }
  }
  if (id && remember && form) {
    try {
      const saved = localStorage.getItem(storageKey);
      if (saved) {
        // Preserve an identifier returned after failed login or filled by the browser.
        if (!id.value.trim()) id.value = saved;
        remember.checked = true;
      }
    } catch (_) { storageUnavailable(); }
    remember.addEventListener('change', saveIdentifierPreference);
    id.addEventListener('input', saveIdentifierPreference);
    id.addEventListener('change', saveIdentifierPreference);
    form.addEventListener('submit', saveIdentifierPreference);
  }

  // Loading state
  const btn = document.getElementById('submitBtn');
  if (btn && form) {
    form.addEventListener('submit', () => {
      btn.classList.add('loading');
      btn.disabled = true;
      setTimeout(() => { btn.classList.remove('loading'); btn.disabled = false; }, 8000);
    });
  }

  // Lockout countdown
  const errBox = document.querySelector('.auth-notice.error[data-locked-seconds]');
  if (errBox) {
    let remaining = parseInt(errBox.getAttribute('data-locked-seconds') || '0', 10);
    if (remaining > 0) {
      const tick = () => {
        if (remaining <= 0) { location.reload(); return; }
        const m = Math.floor(remaining / 60);
        const s = remaining % 60;
        errBox.textContent = m > 0
          ? 'Too many failed attempts. Please try again in ' + m + ' min ' + s + ' sec.'
          : 'Too many failed attempts. Please try again in ' + s + ' sec.';
        remaining -= 1;
      };
      tick();
      setInterval(tick, 1000);
      [btn, id, pw].forEach(el => { if (el) el.disabled = true; });
    }
  }
})();
</script>
</body>
</html>
