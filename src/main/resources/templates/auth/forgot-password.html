<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quên mật khẩu | CinemaSystem</title>
<link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<div class="auth-page">
  <aside class="auth-hero" aria-label="Không gian rạp chiếu phim">
    <div class="auth-hero-caption">
      <div class="eyebrow">Password recovery</div>
      <h1>Quên mật khẩu?</h1>
      <div class="line"></div>
      <p>Nhập email đã đăng ký. Nếu email phù hợp với một tài khoản, chúng tôi sẽ gửi hướng dẫn xác minh.</p>
    </div>
  </aside>

  <main class="auth-panel-wrap">
    <section class="auth-panel" aria-labelledby="forgot-title">
      <div class="auth-brand-mobile">
        <span class="auth-brand-mark">▶</span><span>CINEMA SYSTEM</span>
      </div>
      <h2 id="forgot-title">Khôi phục mật khẩu</h2>
      <p class="auth-intro">Vui lòng nhập email đăng ký. Mã OTP sẽ được gửi đến email này.</p>

      <div class="auth-notice error" role="alert" th:if="${formError}" th:text="${formError}"></div>

      <form th:action="@{/forgot-password}" th:object="${forgotForm}" method="post" novalidate>
        <input type="hidden" name="_csrf" th:value="${_csrf.token}">
        <div class="auth-field" th:classappend="${emailError != null} ? 'has-error' : ''">
          <label for="email">EMAIL ĐĂNG KÝ</label>
          <div class="auth-input-wrap" th:classappend="${emailError != null} ? 'invalid' : ''">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
            <input id="email" type="email" th:field="*{email}" autocomplete="email" maxlength="255"
                   placeholder="name@example.com" required>
          </div>
          <p class="auth-error" th:if="${emailError}" th:text="${emailError}"></p>
        </div>

        <button class="auth-btn" type="submit" id="submitBtn">
          <span class="label">GỬI MÃ XÁC MINH</span><span class="spinner" aria-hidden="true"></span>
        </button>
      </form>

      <div class="auth-bottom"><a th:href="@{/login}">← Quay lại đăng nhập</a></div>
    </section>
  </main>
</div>

<script>
(() => {
  const btn = document.getElementById('submitBtn');
  if (btn) {
    document.querySelector('form').addEventListener('submit', () => {
      btn.classList.add('loading');
      btn.disabled = true;
      setTimeout(() => { btn.classList.remove('loading'); btn.disabled = false; }, 8000);
    });
  }
})();
</script>
</body>
</html>
