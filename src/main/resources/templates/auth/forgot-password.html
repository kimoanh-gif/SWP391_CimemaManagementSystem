<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password | CINEORA</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/cineora-forgot-password.css" th:href="@{/css/cineora-forgot-password.css}">
</head>
<body>
<header><a class="brand" href="/" th:href="@{/}"><img src="/images/cineora-logo.png" th:src="@{/images/cineora-logo.png}" alt="CINEORA logo"><span><strong>CINEORA</strong><small>Every Story Begins Here</small></span></a></header>
<main><div class="card" role="region" aria-labelledby="forgot-title"><div class="accent"></div><div class="inner">
<div class="head"><img src="/images/cineora-logo.png" th:src="@{/images/cineora-logo.png}" alt="CINEORA"><h1 id="forgot-title">Forgot Password?</h1><p>Enter your registered email address to receive a six-digit verification code.</p></div>
<div class="steps" role="img" aria-label="Password recovery: step 1 of 4, request verification code"><span class="active"></span><span></span><span></span><span></span></div>
<div class="auth-notice error" role="alert" th:if="${formError}" th:text="${formError}"></div>
<form th:action="@{/forgot-password}" th:object="${forgotForm}" method="post" novalidate>
        <input type="hidden" name="_csrf" th:value="${_csrf.token}">
        <div class="auth-field" th:classappend="${emailError != null} ? 'has-error' : ''">
          <label for="email">EMAIL ĐĂNG KÝ</label>
          <div class="auth-input-wrap" th:classappend="${emailError != null} ? 'invalid' : ''">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
            <input id="email" type="email" th:field="*{email}" autocomplete="email" maxlength="255"
                   placeholder="name@example.com" required>
          </div>
          <p class="auth-error" th:if="${emailError}" th:text="${emailError}"></p>
        </div>

        <button class="auth-btn" type="submit" id="submitBtn">
          <span class="label">GỬI MÃ XÁC MINH</span><span class="spinner" aria-hidden="true"></span>
        </button>
      </form>
<div class="auth-bottom"><a th:href="@{/login}">← Quay lại đăng nhập</a></div>
</div></div></main>
<script>
(() => {
  const btn = document.getElementById('submitBtn');
  if (btn) {
    document.querySelector('form').addEventListener('submit', () => {
      btn.classList.add('loading');
      btn.disabled = true;
      setTimeout(() => { btn.classList.remove('loading'); btn.disabled = false; }, 8000);
    });
  }
})();
</script>
</body></html>
