<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verify Your Email | CINEORA</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/cineora-otp.css" th:href="@{/css/cineora-otp.css}">
</head>
<body th:attr="data-redirect-delay=${redirectDelay}">
<header><a class="brand" href="/" th:href="@{/}"><img src="/images/cineora-logo.png" th:src="@{/images/cineora-logo.png}" alt="CINEORA logo"><span><strong>CINEORA</strong><small>Every Story Begins Here</small></span></a><a class="nav" href="/register" th:href="@{/register}">Back to Register</a></header>
<main><section class="card" aria-labelledby="otp-title">
 <div class="emblem"><img src="/images/cineora-logo.png" th:src="@{/images/cineora-logo.png}" alt="CINEORA"></div>
 <span class="step">STEP 2 OF 2</span><h1 id="otp-title">Verify Your Email</h1>
 <p>Enter the 6-digit verification code sent to your email address.</p>
 <div class="email" th:if="${email}" th:text="${email}">Your registered email</div>
 <div class="auth-notice error"   role="alert"  th:if="${formError}"  th:text="${formError}"></div>
      <div class="auth-notice success" role="status" th:if="${formSuccess}" th:text="${formSuccess}"></div>
      <div class="auth-notice success" id="activationSuccess" role="status"
           th:if="${activationSuccess}" th:text="${activationSuccess}"></div>

      <!-- Fallback OTP display when email delivery fails -->
      <div class="auth-notice warning" role="alert" th:if="${fallbackOtp}">
        ⚠️ Gửi email thất bại — mã OTP của bạn: <strong th:text="${fallbackOtp}"></strong>
      </div>

      <form th:action="@{/verify-activation-otp}" th:object="${activationForm}" method="post" novalidate>
        <input type="hidden" name="_csrf" th:value="${_csrf.token}">
        <div class="auth-field" th:classappend="${otpError != null} ? 'has-error' : ''">
          <label for="otp">MÃ OTP</label>
          <div class="auth-input-wrap" th:classappend="${otpError != null} ? 'invalid' : ''">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            <input id="otp" class="otp-input" type="text" inputmode="numeric" pattern="\d{6}" maxlength="6"
                   th:field="*{otp}" autocomplete="one-time-code" placeholder="••••••" required>
          </div>
          <p class="auth-error" th:if="${otpError}" th:text="${otpError}"></p>
        </div>

        <button class="auth-btn" type="submit" id="submitBtn">
          <span class="label">XÁC MINH</span><span class="spinner" aria-hidden="true"></span>
        </button>
      </form>

      <div class="otp-resend" id="otpResend">
        <span class="cooldown">Không nhận được mã?
          <a href="#" id="resendLink" th:data-cooldown="${resendCooldownSeconds}">Gửi lại</a>
        </span>
      </div>

      <div class="auth-bottom"><a th:href="@{/login}">← Quay lại đăng nhập</a></div>
 </section></main>
<script>
(() => {
  // Check if an error was just shown (prevent auto-submit race condition)
  const hasError = document.querySelector('.auth-notice.error') !== null;
  const activationSucceeded = document.getElementById('activationSuccess') !== null;
  const shouldPreventAutoSubmit = hasError || activationSucceeded;

  // Auto-submit when 6 digits entered (only if no error/success message shown)
  const otp = document.getElementById('otp');
  const form = document.querySelector('form');
  if (otp && form && !shouldPreventAutoSubmit) {
    otp.addEventListener('input', () => {
      otp.value = otp.value.replace(/\D/g, '').slice(0, 6);
      if (otp.value.length === 6) {
        form.submit();
      }
    });
  }
  // Paste support
  if (otp) {
    otp.addEventListener('paste', (e) => {
    e.preventDefault();
      const data = (e.clipboardData || window.clipboardData).getData('text') || '';
      const digits = data.replace(/\D/g, '').slice(0, 6);
      otp.value = digits;
      otp.dispatchEvent(new Event('input'));
    });
  }

  // If success message shown, auto-redirect after delay
  if (activationSucceeded) {
    const redirectDelay = parseInt(document.body.getAttribute('data-redirect-delay') || '5000', 10);
    setTimeout(() => {
      window.location.href = '/login?activated';
    }, redirectDelay);
  }

  // Cooldown for resend link
  const resend = document.getElementById('resendLink');
  if (resend) {
    const cooldown = parseInt(resend.getAttribute('data-cooldown') || '60', 10);
    let remaining = cooldown;
    const update = () => {
      if (remaining <= 0) {
        resend.textContent = 'Gửi lại';
        resend.style.pointerEvents = 'auto';
        resend.style.opacity = '1';
        resend.removeAttribute('aria-disabled');
        return;
      }
      resend.innerHTML = 'Gửi lại sau <span class="otp-countdown">' + remaining + 's</span>';
      resend.style.pointerEvents = 'none';
      resend.style.opacity = '.6';
      resend.setAttribute('aria-disabled', 'true');
      remaining -= 1;
      setTimeout(update, 1000);
    };
    update();
    resend.addEventListener('click', (e) => {
      e.preventDefault();
      if (resend.style.pointerEvents === 'none') return;
      // Submit to resend endpoint
      const f = document.createElement('form');
      f.method = 'POST';
      f.action = '/verify-activation-otp/resend';
      document.body.appendChild(f); f.submit();
    });
  }

  // Loading
  const btn = document.getElementById('submitBtn');
  if (btn && form) {
    form.addEventListener('submit', () => {
      btn.classList.add('loading');
      btn.disabled = true;
      setTimeout(() => { btn.classList.remove('loading'); btn.disabled = false; }, 8000);
    });
  }
})();
</script>
</body>
</html>
