<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Reviews | CINEORA</title><link rel="stylesheet" th:href="@{/css/cinema-portal.css}"><link rel="stylesheet" th:href="@{/css/customer-profile.css}"></head>
<body class="customer-account-page"><div th:replace="~{fragments/cinema-header-footer :: header('profile')}"></div>
<main class="profile-main"><div class="profile-content"><div class="profile-page-heading"><div><nav class="profile-breadcrumb profile-title-breadcrumb"><a th:href="@{/}">Home</a><span>›</span><strong>Reviews</strong></nav><h1>My Movie Reviews</h1><p class="profile-subtitle">Rate movies from completed, successfully paid bookings.</p></div></div>
<div class="review-library" th:if="${!movies.isEmpty()}"><article class="profile-card review-library-card" th:each="movie : ${movies}"><img th:src="${movie.posterUrl()}" th:alt="${movie.title()}"><div class="review-library-info"><p class="profile-eyebrow" th:text="${movie.bookingCode()}">BOOKING</p><h2 th:text="${movie.title()}">Movie</h2><p th:text="${'Screened on ' + movie.formattedShowtime}">Showtime</p><div class="review-status" th:classappend="${movie.reviewed} ? ' is-reviewed'" th:text="${movie.reviewed ? 'Reviewed · ' + movie.rating() + '/5 stars' : 'Ready for review'}">Ready</div><p class="review-excerpt" th:if="${movie.reviewed}" th:text="${movie.reviewContent()}"></p><a class="profile-button profile-button-primary" th:href="@{/movies/{id}(id=${movie.movieId()},bookingId=${movie.bookingId()})} + '#reviews'" th:text="${movie.reviewed ? 'Edit Review' : 'Write Review'}">Write Review</a></div></article></div>
<section class="profile-card review-empty" th:if="${movies.isEmpty()}"><h2>No movies are ready for review</h2><p>Movies appear here after a confirmed, paid screening has ended.</p><a class="profile-button" th:href="@{/customer/booking/history}">View Booking History</a></section>
</div></main><div th:replace="~{fragments/cinema-header-footer :: footer}"></div><th:block th:replace="~{fragments/cinema-header-footer :: scripts}"></th:block></body></html>
