<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Digital Tickets | CINEORA</title><link rel="stylesheet" th:href="@{/css/customer-booking.css}"></head><body><header class="site-header"><a class="brand" th:href="@{/}"><span>C</span><span><b>CINEORA</b><small>CINEMA SUITES</small></span></a><nav><a th:href="@{/customer/booking}">Book Tickets</a><a class="active" th:href="@{/customer/booking/history}">My Tickets</a></nav></header><main class="booking-shell"><section class="hero-row compact"><div><p class="eyebrow">MY DIGITAL TICKETS</p><h1>My Digital Tickets</h1><p class="lead">Present your ticket code when checking in at the cinema.</p></div></section><div class="ticket-grid"><article class="digital-ticket panel" th:each="ticket : ${tickets}"><div class="ticket-top"><span class="status-pill" th:text="${ticket.ticketStatus}"></span><b th:text="${ticket.bookingCode}"></b></div><h2 th:text="${ticket.movieTitle}"></h2><dl><div><dt>Showtime</dt><dd th:text="${#temporals.format(ticket.startTime,'HH:mm · dd/MM/yyyy')}"></dd></div><div><dt>Auditorium</dt><dd th:text="${ticket.roomName}"></dd></div><div><dt>Seat</dt><dd th:text="${ticket.seatLabel}"></dd></div></dl><div class="fake-qr ticket-qr"><span>C</span></div><code th:text="${ticket.qrCode}"></code></article></div><p><a class="button secondary" th:href="@{/customer/booking/history}">Back to Booking History</a></p></main></body></html>
