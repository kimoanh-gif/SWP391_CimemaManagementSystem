<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Booking History | CINEORA</title><link rel="stylesheet" th:href="@{/css/customer-booking.css}"></head><body><header class="site-header"><a class="brand" th:href="@{/}"><span>C</span><span><b>CINEORA</b><small>CINEMA SUITES</small></span></a><nav><a th:href="@{/customer/booking}">Book Tickets</a><a class="active" th:href="@{/customer/booking/history}">My Tickets</a></nav></header><main class="booking-shell"><section class="hero-row compact"><div><p class="eyebrow">CINEORA ACCOUNT</p><h1>Booking &amp; Transaction History</h1><p class="lead">Track reservations, payments, and issued tickets.</p></div></section><section class="history-list" th:if="${!#lists.isEmpty(bookings)}"><article class="panel history-card" th:each="booking : ${bookings}"><div><span class="status-pill" th:text="${booking.bookingStatus}"></span><small th:text="${booking.paymentStatus}"></small></div><h2 th:text="${booking.movieTitle}"></h2><p><b th:text="${booking.bookingCode}"></b> · <span th:text="${booking.seatLabels ?: 'Seats released'}"></span></p><p th:text="${booking.roomName + ' · ' + #temporals.format(booking.startTime,'HH:mm dd/MM/yyyy')}"></p><strong th:text="${#numbers.formatDecimal(booking.totalAmount,0,'COMMA',0,'POINT') + ' ₫'}"></strong><a th:if="${booking.bookingStatus == 'CONFIRMED'}" class="button secondary" th:href="@{/customer/booking/tickets/{id}(id=${booking.bookingId})}">View Digital Tickets</a></article></section><section class="panel empty-state" th:if="${#lists.isEmpty(bookings)}"><h2>You have no booking history yet</h2><a class="button primary" th:href="@{/customer/booking}">Book Tickets Now</a></section></main></body></html>
