<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Booking Confirmed | CINEORA</title><link rel="stylesheet" th:href="@{/css/customer-booking.css}"></head><body><header class="site-header"><a class="brand" th:href="@{/}"><span>C</span><span><b>CINEORA</b><small>CINEMA SUITES</small></span></a><nav><a th:href="@{/customer/booking}">Book Tickets</a><a th:href="@{/customer/booking/history}">My Tickets</a></nav></header><main class="booking-shell"><section class="panel success-stage"><div class="success-mark">✓</div><p class="eyebrow">TRANSACTION COMPLETE</p><h1>Booking and Payment Successful!</h1><p>Your seats are confirmed and your digital tickets have been issued.</p><div class="ticket-mini" th:if="${!#lists.isEmpty(tickets)}"><b th:text="${tickets[0].movieTitle}"></b><span th:text="${tickets[0].bookingCode}"></span><span th:text="${#temporals.format(tickets[0].startTime,'HH:mm · dd/MM/yyyy')}"></span></div><div class="success-actions"><a class="button primary" th:href="@{/customer/booking/tickets/{id}(id=${bookingId})}">View Digital Tickets</a><a class="button secondary" th:href="@{/customer/booking/history}">Booking History</a></div></section></main></body></html>
