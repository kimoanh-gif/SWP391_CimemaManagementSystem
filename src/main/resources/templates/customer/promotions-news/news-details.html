<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/cinema-header-footer :: metaHead(${news.title} + ' - News')}">
    <title>News | CINEORA</title>
</head>
<body class="cineora-catalog-page">

<!-- Header -->
<div th:replace="~{fragments/cinema-header-footer :: header('promotions-news')}"></div>

<main class="section-shell" style="padding-top:2.5rem;max-width:960px;">
    <!-- Breadcrumb & Title -->
    <div style="margin-bottom:2rem;">
        <div style="font-size:0.85rem;color:var(--text-muted);margin-bottom:8px;">
            <a th:href="@{/}" style="color:var(--text-secondary);">Home</a>
            <span> / </span>
            <a th:href="@{/promotions-news(tab='news')}" style="color:var(--text-secondary);">News &amp; Events</a>
            <span> / </span>
            <span style="color:var(--primary-light);">Article</span>
        </div>
        <span class="hero-tag" style="margin-bottom:12px;" th:text="${news.category}">Cinema News</span>
        <h1 style="font-size:clamp(1.8rem, 3.5vw, 2.6rem);font-weight:900;" th:text="${news.title}">Article Title</h1>
        <div class="detail-meta">
            <span>✍️ By <strong style="color:var(--text-primary);" th:text="${news.authorName}">CINEORA Team</strong></span>
            <span>·</span>
            <span>📅 Published <strong th:text="${news.formattedPublishedDate}">18/10/2026</strong></span>
        </div>
    </div>

    <div th:replace="~{fragments/public-alerts :: alerts}"></div>

    <div class="detail-banner" style="height:360px;">
        <img th:src="${news.thumbnailUrl}" th:alt="${news.title}"
             onerror="this.onerror=null;this.src='/images/cinema-login-hero.png'" />
    </div>

    <article class="detail-card">
        <div class="detail-body" th:text="${news.content}">Full article content.</div>
    </article>

    <!-- Other news -->
    <div th:if="${!otherNews.isEmpty()}" style="margin-bottom:2.5rem;">
        <h3 style="font-size:1.35rem;margin-bottom:1.25rem;">More News</h3>
        <div class="news-grid" style="grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));">
            <article class="news-card" th:each="item : ${otherNews}">
                <div class="news-thumbnail-wrap" style="height:150px;">
                    <img th:src="${item.thumbnailUrl}" th:alt="${item.title}" class="news-thumbnail"
                         onerror="this.onerror=null;this.src='/images/cinema-login-hero.png'" />
                </div>
                <div class="news-body" style="padding:1.2rem;">
                    <h4 class="news-title" style="font-size:1rem;">
                        <a th:href="@{/news/{id}(id=${item.newsId})}" th:text="${item.title}">Title</a>
                    </h4>
                    <span style="font-size:0.75rem;color:var(--text-muted);" th:text="${item.formattedPublishedDate}">18/10/2026</span>
                </div>
            </article>
        </div>
    </div>

    <div class="detail-actions">
        <a th:href="@{/promotions-news(tab='news')}" class="btn-secondary"><span>← Back to News</span></a>
        <a th:href="@{/movies(type='now-showing')}" class="btn-primary"><span>See Movies Now Showing</span></a>
    </div>
</main>

<!-- Trailer Modal & Toast -->
<div th:replace="~{fragments/cinema-header-footer :: trailerModal}"></div>
<div th:replace="~{fragments/cinema-header-footer :: toast}"></div>

<!-- Footer -->
<div th:replace="~{fragments/cinema-header-footer :: footer}"></div>

<!-- Scripts -->
<th:block th:replace="~{fragments/cinema-header-footer :: scripts}"></th:block>

</body>
</html>
