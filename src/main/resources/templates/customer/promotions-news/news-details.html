<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/cinema-header-footer :: metaHead(${news.title} + ' - News')}">
    <title>CineVerse - Cinema News</title>
</head>
<body>
<div th:replace="~{fragments/cinema-header-footer :: header('promotions-news')}"></div>

<main class="section-shell" style="padding-top:2.5rem;max-width:960px;">
    <div style="margin-bottom:2rem;">
        <div style="font-size:0.85rem;color:var(--text-muted);margin-bottom:8px;">
            <a th:href="@{/}" style="color:var(--text-secondary);">Home</a>
            <span> / </span>
            <a th:href="@{/news}" style="color:var(--text-secondary);">News &amp; Events</a>
            <span> / </span>
            <span style="color:var(--primary-light);">Article Details</span>
        </div>
        <span class="hero-tag" style="margin-bottom:12px;" th:text="${news.category}">Cinema News</span>
        <h1 style="font-size:clamp(1.8rem, 3.5vw, 2.6rem);font-weight:900;" th:text="${news.title}">News Article Title</h1>
        <div style="display:flex;align-items:center;gap:12px;font-size:0.9rem;color:var(--text-muted);margin-top:10px;">
            <span>✍️ By <strong style="color:var(--text-primary);" th:text="${news.authorName}">CineVerse Team</strong></span>
            <span>·</span>
            <span>📅 Published: <strong th:text="${news.formattedPublishedDate}">18/10/2026</strong></span>
        </div>
    </div>
    <div style="width:100%;height:360px;border-radius:var(--radius-lg);overflow:hidden;margin-bottom:2.5rem;box-shadow:var(--shadow-md);border:1px solid var(--border-subtle);">
        <img th:src="${news.thumbnailUrl}" th:alt="${news.title}"
             style="width:100%;height:100%;object-fit:cover;"
             onerror="this.src='/images/cinema-login-hero.png'" />
    </div>
    <article style="background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:2.5rem;line-height:1.9;color:var(--text-secondary);font-size:1.05rem;margin-bottom:3rem;">
        <div style="white-space:pre-line;" th:text="${news.content}">
            Full content of the cinema news article...
        </div>
    </article>
    <div th:if="${otherNews != null && !otherNews.isEmpty()}" style="margin-bottom:3rem;">
        <h3 style="font-size:1.4rem;margin-bottom:1.5rem;color:#fff;">Other News</h3>
        <div class="news-grid" style="grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));">
            <article class="news-card" th:each="item : ${otherNews}" th:if="${item.newsId != news.newsId}">
                <div class="news-thumbnail-wrap" style="height:150px;">
                    <img th:src="${item.thumbnailUrl}" th:alt="${item.title}" class="news-thumbnail"
                         onerror="this.src='/images/cinema-login-hero.png'" />
                </div>
                <div class="news-body" style="padding:1.2rem;">
                    <h4 style="font-size:1rem;font-weight:700;line-height:1.35;margin-bottom:6px;">
                        <a th:href="@{/news/{id}(id=${item.newsId})}" th:text="${item.title}" style="color:#fff;">Title</a>
                    </h4>
                    <span style="font-size:0.75rem;color:var(--text-muted);" th:text="${item.formattedPublishedDate}">18/10/2026</span>
                </div>
            </article>
        </div>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;">
        <a th:href="@{/news}" class="btn-secondary">
            <span>➔ Back to News</span>
        </a>
        <a th:href="@{/movies}" class="btn-primary">
            <span>View Now Showing Movies</span>
        </a>
    </div>
</main>
<div th:replace="~{fragments/cinema-header-footer :: trailerModal}"></div>
<div th:replace="~{fragments/cinema-header-footer :: toast}"></div>
<div th:replace="~{fragments/cinema-header-footer :: footer}"></div>
<th:block th:replace="~{fragments/cinema-header-footer :: scripts}"></th:block>

</body>
</html>
