<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loyalty | CineVerse</title><link rel="stylesheet" th:href="@{/css/cinema-portal.css}"><link rel="stylesheet" th:href="@{/css/customer-profile.css}"></head><body><div th:replace="~{fragments/cinema-header-footer :: header('profile')}"></div><main class="profile-main"><div class="profile-content"><div class="profile-page-heading"><div><nav class="profile-breadcrumb profile-title-breadcrumb"><a th:href="@{/}">Home</a><span>›</span><strong>Loyalty</strong></nav><h1>Membership &amp; Rewards</h1><p class="profile-subtitle">View your membership level and current reward point balance.</p></div></div><section class="profile-card profile-details-card"><p class="profile-eyebrow">CINEVERSE LOYALTY</p><h2 th:text="${(profile.membershipRankName ?: 'STANDARD') + ' Member'}">STANDARD Member</h2><p>More membership benefits and reward transaction details will be added when the loyalty configuration is available.</p><div class="profile-stats"><div class="profile-stat"><strong th:text="${profile.availablePoints}">0</strong><span>Available Points</span></div><div class="profile-stat"><strong th:text="${profile.tierPoints}">0</strong><span>Tier Points</span></div></div></section></div></main><div th:replace="~{fragments/cinema-header-footer :: footer}"></div><th:block th:replace="~{fragments/cinema-header-footer :: scripts}"></th:block></body></html>
