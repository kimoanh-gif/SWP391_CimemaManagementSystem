<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CinemaSystem</title>
<link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<div class="auth-page">
  <aside class="auth-hero" aria-label="Không gian rạp chiếu phim">
    <div class="auth-hero-caption">
      <div class="eyebrow">Welcome</div>
      <h1>Mỗi bộ phim,<br>một thế giới riêng.</h1>
      <div class="line"></div>
      <p>Hệ thống quản lý rạp chiếu phim — đặt vé, tích điểm, ưu đãi thành viên.</p>
    </div>
  </aside>
  <main class="auth-panel-wrap">
    <section class="auth-panel">
      <div class="auth-brand-mobile">
        <span class="auth-brand-mark">▶</span><span>CINEMA SYSTEM</span>
      </div>
      <h2>Chào mừng đến với CinemaSystem</h2>
      <p class="auth-intro">Vui lòng đăng nhập để tiếp tục.</p>
      <a class="auth-btn" th:href="@{/login}" style="text-align:center;display:flex;align-items:center;justify-content:center;text-decoration:none;">
        <span class="label">ĐĂNG NHẬP</span>
      </a>
      <div class="auth-bottom">Chưa có tài khoản? <a th:href="@{/register}">Tạo tài khoản</a></div>
      <div class="auth-fineprint">CINEMA SYSTEM · YOUR CINEMA EXPERIENCE</div>
    </section>
  </main>
</div>
</body>
</html>
